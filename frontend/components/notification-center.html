<!-- 通知中心模态框 -->
<div id="notification_center_modal" class="notification-center-modal" style="display: none;">
    <div class="notification-center-overlay" onclick="window.closeNotificationCenter()"></div>
    <div class="notification-center-container">
        <div class="notification-center-header">
            <h3>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                通知中心
            </h3>
            <button class="notification-center-close" onclick="window.closeNotificationCenter()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        
        <div class="notification-center-tabs">
            <button class="notification-center-tab active" data-tab="announcements" onclick="window.switchNotificationCenterTab('announcements')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                </svg>
                公告
            </button>
            <button class="notification-center-tab" data-tab="updates" onclick="window.switchNotificationCenterTab('updates')">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
                </svg>
                更新日志
            </button>
        </div>
        
        <div class="notification-center-body">
            <div id="announcements_tab" class="notification-center-tab-content active">
                <div id="announcements_list" class="notification-list">
                    <div class="notification-loading">加载中...</div>
                </div>
            </div>
            
            <div id="updates_tab" class="notification-center-tab-content" style="display: none;">
                <div id="updates_list" class="notification-list">
                    <div class="notification-loading">加载中...</div>
                </div>
            </div>
        </div>
        
        <div class="notification-center-footer">
            <span class="notification-last-update" id="notification_last_update"></span>
        </div>
    </div>
</div>

<style>
    .notification-center-modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10001;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        padding: 60px 20px 20px 20px;
    }

    .notification-center-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(2px);
    }

    .notification-center-container {
        position: relative;
        width: 420px;
        max-width: 90vw;
        max-height: 70vh;
        background: white;
        border-radius: 16px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: slideInRight 0.3s ease-out;
    }

    @keyframes slideInRight {
        from {
            transform: translateX(20px);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    .notification-center-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
        color: white;
    }

    .notification-center-header h3 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 16px;
        font-weight: 600;
    }

    .notification-center-close {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        transition: all 0.2s ease;
    }

    .notification-center-close:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: rotate(90deg);
    }

    .notification-center-tabs {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        background: #F9FAFB;
        border-bottom: 1px solid #E5E7EB;
    }

    .notification-center-tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        color: #6B7280;
        background: white;
        border: 1px solid #E5E7EB;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .notification-center-tab:hover {
        background: #F3F4F6;
        color: #374151;
    }

    .notification-center-tab.active {
        background: #22C55E;
        color: white;
        border-color: #22C55E;
    }

    .notification-center-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
    }

    .notification-center-tab-content {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .notification-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .notification-loading {
        text-align: center;
        padding: 40px 20px;
        color: #9CA3AF;
    }

    .notification-item-card {
        background: #F9FAFB;
        border-radius: 12px;
        padding: 16px;
        border: 1px solid #E5E7EB;
        transition: all 0.2s ease;
    }

    .notification-item-card:hover {
        background: #F3F4F6;
        border-color: #D1D5DB;
    }

    .notification-item-card.priority-high {
        border-left: 4px solid #EF4444;
        background: #FEF2F2;
    }

    .notification-item-card.priority-medium {
        border-left: 4px solid #F59E0B;
    }

    .notification-item-card.priority-low {
        border-left: 4px solid #3B82F6;
    }

    .notification-item-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 8px;
    }

    .notification-item-title {
        font-size: 14px;
        font-weight: 600;
        color: #1F2937;
        margin: 0;
    }

    .notification-item-date {
        font-size: 11px;
        color: #9CA3AF;
        white-space: nowrap;
    }

    .notification-item-content {
        font-size: 13px;
        color: #4B5563;
        line-height: 1.5;
    }

    .notification-item-meta {
        display: flex;
        gap: 12px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #E5E7EB;
        font-size: 12px;
        color: #6B7280;
    }

    .notification-item-meta-item {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .notification-item-meta-item svg {
        width: 14px;
        height: 14px;
    }

    .notification-center-footer {
        padding: 12px 20px;
        background: #F9FAFB;
        border-top: 1px solid #E5E7EB;
        text-align: center;
    }

    .notification-last-update {
        font-size: 12px;
        color: #9CA3AF;
    }

    .notification-empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #9CA3AF;
    }

    .notification-empty-state svg {
        width: 48px;
        height: 48px;
        margin-bottom: 12px;
        color: #D1D5DB;
    }

    .notification-empty-state p {
        font-size: 14px;
    }

    .update-section {
        margin-bottom: 20px;
    }

    .update-section:last-child {
        margin-bottom: 0;
    }

    .update-section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid #E5E7EB;
    }

    .update-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .update-list-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 12px;
        margin-bottom: 6px;
        background: white;
        border-radius: 6px;
        font-size: 13px;
        color: #4B5563;
    }

    .update-list-item:last-child {
        margin-bottom: 0;
    }

    .update-list-icon {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        margin-top: 2px;
    }

    .update-list-icon.new {
        color: #22C55E;
    }

    .update-list-icon.improved {
        color: #3B82F6;
    }

    .update-list-icon.developing {
        color: #F59E0B;
    }

    @media (max-width: 480px) {
        .notification-center-modal {
            padding: 50px 10px 10px 10px;
        }

        .notification-center-container {
            width: 100%;
            max-height: 80vh;
        }

        .notification-center-tabs {
            flex-direction: column;
        }

        .notification-center-tab {
            justify-content: center;
        }
    }

    [data-theme="dark"] .notification-center-container {
        background: #1e293b;
    }

    [data-theme="dark"] .notification-center-header {
        background: linear-gradient(135deg, #065f46 0%, #047857 100%);
    }

    [data-theme="dark"] .notification-center-tabs {
        background: #0f172a;
        border-bottom-color: #334155;
    }

    [data-theme="dark"] .notification-center-tab {
        background: #1e293b;
        border-color: #334155;
        color: #94a3b8;
    }

    [data-theme="dark"] .notification-center-tab:hover {
        background: #334155;
        color: #e2e8f0;
    }

    [data-theme="dark"] .notification-center-tab.active {
        background: #22C55E;
        color: white;
        border-color: #22C55E;
    }

    [data-theme="dark"] .notification-center-body {
        background: #1e293b;
    }

    [data-theme="dark"] .notification-item-card {
        background: #0f172a;
        border-color: #334155;
    }

    [data-theme="dark"] .notification-item-card:hover {
        background: #1e293b;
        border-color: #475569;
    }

    [data-theme="dark"] .notification-item-card.priority-high {
        background: rgba(239, 68, 68, 0.1);
    }

    [data-theme="dark"] .notification-item-title {
        color: #e2e8f0;
    }

    [data-theme="dark"] .notification-item-content {
        color: #94a3b8;
    }

    [data-theme="dark"] .notification-center-footer {
        background: #0f172a;
        border-top-color: #334155;
    }

    [data-theme="dark"] .notification-empty-state {
        color: #64748b;
    }

    [data-theme="dark"] .notification-empty-state svg {
        color: #475569;
    }

    [data-theme="dark"] .update-section-title {
        color: #e2e8f0;
        border-bottom-color: #334155;
    }

    [data-theme="dark"] .update-list-item {
        background: #1e293b;
        color: #94a3b8;
    }
</style>
