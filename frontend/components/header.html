<header class="app-header">
    <div class="app-branding">
        <div class="logo-container">
            <div class="alfred-robot-container" id="alfred-robot" title="点击进入CLI智能助手">
                <svg class="alfred-robot" width="50" height="65" viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg">
                    <!-- 像素机器人 - 更可爱的设计 -->
                    <g class="robot-body" transform="rotate(12 8 10)">
                        <!-- 头部 - 6x5像素 -->
                        <rect x="5" y="0" width="6" height="5" fill="#4CAF50"/>
                        <!-- 眼睛 - 2x2像素，更紧凑 -->
                        <rect class="robot-eye left-eye" x="6" y="1" width="2" height="2" fill="#ffffff"/>
                        <rect class="robot-eye right-eye" x="8" y="1" width="2" height="2" fill="#ffffff"/>
                        <!-- 嘴巴 - 2x1像素 -->
                        <rect x="7" y="3" width="2" height="1" fill="#ffffff"/>
                        <!-- 天线 -->
                        <rect x="7" y="-1" width="2" height="1" fill="#4CAF50"/>
                        <rect x="7" y="-2" width="2" height="1" fill="#66BB6A"/>
                        
                        <!-- 身体 - 6x6像素 -->
                        <rect x="5" y="6" width="6" height="6" fill="#4CAF50"/>
                        <!-- 胸部装饰 -->
                        <rect x="6" y="7" width="4" height="1" fill="#ffffff"/>
                        <rect x="7" y="9" width="2" height="2" fill="#ffffff"/>
                        
                        <!-- 手臂 - 举起状态 -->
                        <g class="robot-arms">
                            <!-- 左臂 - 举起 -->
                            <g class="left-arm" transform="rotate(-45 5 8)">
                                <rect x="2" y="6" width="3" height="2" fill="#4CAF50"/>
                                <rect x="1" y="5" width="2" height="2" fill="#66BB6A"/>
                            </g>
                            <!-- 右臂 - 举起 -->
                            <g class="right-arm" transform="rotate(45 11 8)">
                                <rect x="11" y="6" width="3" height="2" fill="#4CAF50"/>
                                <rect x="13" y="5" width="2" height="2" fill="#66BB6A"/>
                            </g>
                        </g>
                        
                        <!-- 腿部 - 2x5像素 -->
                        <rect x="5" y="13" width="2" height="5" fill="#4CAF50"/>
                        <rect x="9" y="13" width="2" height="5" fill="#4CAF50"/>
                        <!-- 脚 -->
                        <rect x="4" y="18" width="3" height="2" fill="#66BB6A"/>
                        <rect x="9" y="18" width="3" height="2" fill="#66BB6A"/>
                    </g>
                </svg>
                <div class="robot-tooltip" id="robot-tooltip">Hi! 我是Alfred</div>
            </div>
            <h1 class="banner-text-logo">ALFRED X IP</h1>
            <img src="frontend/images/ALFRED X IP LOGO.webp" alt="Alfred X IP Logo" class="image-logo">
        </div>
        <div class="version-number">版本号: v26</div>
    </div>
    <div class="api-config-section">
        <button id="notification_center_btn" class="notification-toggle-btn" title="通知中心">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        </button>
        <button id="prompt_forum_btn" class="forum-entry-btn" title="提示词广场">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </button>
        <button id="theme_toggle_btn" class="theme-toggle-btn" title="切换主题 (亮色/暗色)">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
        <button id="api_config_toggle_btn" class="api-config-toggle" title="API Key 设置">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </button>
        <button id="get_api_key_btn" class="get-api-key-toggle" title="获取 API Key">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
            </svg>
        </button>
        <div id="api_config_container" class="api-config-container">
            <div id="zhipu_api_config" class="config-item">
                <label for="global_api_key_input">智谱AI API Key:</label>
                <div class="api-key-wrapper">
                    <input type="password" id="global_api_key_input" placeholder="在此处粘贴智谱AI API Key">
                    <div class="api-key-actions">
                        <button type="button" id="zhipu_test_connection_btn" class="api-key-action-btn test-connection-btn" title="测试连通性">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        </button>
                        <button type="button" id="api_key_copy_btn" class="api-key-action-btn" title="复制">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                        <button type="button" id="api_key_delete_btn" class="api-key-action-btn" title="删除">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                        <button type="button" id="api_key_toggle_visibility_btn" class="password-toggle-btn" title="显示/隐藏">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div id="aliyun_api_config" class="config-item">
                <label for="aliyun_api_key_input">阿里云百炼 API Key:</label>
                <div class="api-key-wrapper">
                    <input type="password" id="aliyun_api_key_input" placeholder="在此处粘贴阿里云百炼 API Key">
                    <div class="api-key-actions">
                        <button type="button" id="aliyun_test_connection_btn" class="api-key-action-btn test-connection-btn" title="测试连通性">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        </button>
                        <button type="button" id="aliyun_api_key_copy_btn" class="api-key-action-btn" title="复制">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                        <button type="button" id="aliyun_api_key_delete_btn" class="api-key-action-btn" title="删除">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                        <button type="button" id="aliyun_api_key_toggle_visibility_btn" class="password-toggle-btn" title="显示/隐藏">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <p style="font-size: 0.8em; color: #888; margin-top: 5px;">新用户可获得100万Tokens免费额度，有效期90天</p>
            </div>
            <div class="api-config-footer">
                <span id="api_key_save_status"></span>
                <button id="api_key_save_btn" class="small-button">保存</button>
            </div>
        </div>
    </div>
</header>
