<script>
(function () {
    class EmbeddedPatentCLI {
        constructor() {
            this.history = [];
            this.historyIndex = -1;
            this.initialized = false;
            this.modelData = { providers: [], default_provider: null };
            this.flowData = { flows: [] };
            this.currentStreamAnswer = '';
            this.pendingAttachment = null;
            this.currentReader = null;
            this.isStreaming = false;
            this.progressStartedAt = 0;
            this.progressTimer = null;
            this.workflowNodes = [];
            this.activeNodeId = null;
            this.nodeColors = ['#f97316', '#22c55e', '#38bdf8', '#a78bfa', '#f43f5e', '#eab308', '#14b8a6', '#c084fc'];
            this.nodeColorIndex = 0;
            this.commandSnapshot = null;
            this.defaultWelcomeHtml = '';
            this.suggestionDefaults = [
                '查询 CN104154208B 专利详情',
                '查询 US12390907B2 专利详情',
                '基于刚才专利结果分析创新点',
                '查询 CN104154208B 与 US12390907B2 对比分析',
                'flow list',
                '预测IPC分类',
                '处理 Excel'
            ];
        }

        init() {
            if (this.initialized) return;
            this.cacheElements();
            this.defaultWelcomeHtml = this.output?.innerHTML || '';
            this.initWorkflowBar();
            this.bindEvents();
            this.loadHistory();
            this.loadBootstrapData();
            this.renderSuggestions();
            this.initialized = true;
        }

        cacheElements() {
            this.container = document.getElementById('cli-agent-container');
            this.launcher = document.getElementById('cli-launcher');
            this.output = document.getElementById('cli-output');
            this.input = document.getElementById('cli-input');
            this.sendBtn = document.getElementById('cli-send-btn');
            this.stopBtn = document.getElementById('cli-stop-btn');
            this.fileBtn = document.getElementById('cli-file-btn');
            this.fileInput = document.getElementById('cli-file-input');
            this.ocrEngineSelect = document.getElementById('cli-ocr-engine');
            this.pagePicker = document.getElementById('cli-page-picker');
            this.pagePickerDesc = document.getElementById('cli-page-picker-desc');
            this.pagePickerMode = document.getElementById('cli-page-picker-mode');
            this.pagePickerInputWrap = document.getElementById('cli-page-picker-input-wrap');
            this.pagePickerInput = document.getElementById('cli-page-picker-input');
            this.providerSelect = document.getElementById('cli-provider-select');
            this.modelSelect = document.getElementById('cli-model-select');
            this.providerStatus = document.getElementById('cli-status-provider');
            this.nodeStatus = document.getElementById('cli-status-node');
            this.suggestions = document.getElementById('cli-suggestions');
            this.workflowList = document.getElementById('cli-workflow-list');
            this.nodeCreateBtn = document.getElementById('cli-node-create');
        }

        bindEvents() {
            this.launcher?.addEventListener('click', () => this.open());
            document.getElementById('cli-btn-close')?.addEventListener('click', () => this.close());
            document.getElementById('cli-btn-minimize')?.addEventListener('click', () => this.toggleMinimize());
            document.getElementById('cli-btn-expand')?.addEventListener('click', () => this.toggleFullscreen());
            this.sendBtn?.addEventListener('click', () => this.executeCommand());
            this.stopBtn?.addEventListener('click', () => this.stopStreaming());
            this.fileBtn?.addEventListener('click', () => this.fileInput?.click());
            this.fileInput?.addEventListener('change', (event) => this.handleFileSelect(event));
            document.getElementById('cli-page-picker-cancel')?.addEventListener('click', () => this.closePagePicker());
            document.getElementById('cli-page-picker-apply')?.addEventListener('click', () => this.applyPageSelection());
            this.pagePickerMode?.addEventListener('change', () => this.syncPagePickerMode());
            this.providerSelect?.addEventListener('change', () => this.refreshModelOptions());
            this.input?.addEventListener('input', () => this.renderSuggestions());
            this.nodeCreateBtn?.addEventListener('click', () => this.createManualNode());

            this.workflowList?.addEventListener('click', (event) => {
                const actionNode = event.target.closest('[data-node-action]');
                const nodeEl = event.target.closest('[data-node-id]');
                if (!nodeEl) return;
                const nodeId = nodeEl.getAttribute('data-node-id');
                if (!nodeId) return;
                if (actionNode) {
                    event.preventDefault();
                    event.stopPropagation();
                    this.handleNodeAction(nodeId, actionNode.getAttribute('data-node-action'));
                    return;
                }
                this.switchNode(nodeId);
            });

            this.input?.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    this.executeCommand();
                    return;
                }
                if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    this.navigateHistory(-1);
                    return;
                }
                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    this.navigateHistory(1);
                    return;
                }
                if (event.key.toLowerCase() === 'l' && event.ctrlKey) {
                    event.preventDefault();
                    this.clearOutput();
                    return;
                }
                if (event.key === 'Escape' && this.container?.classList.contains('fullscreen')) {
                    event.preventDefault();
                    this.toggleFullscreen(false);
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && this.container?.classList.contains('fullscreen')) {
                    this.toggleFullscreen(false);
                }
            });
        }

        initWorkflowBar() {
            if (!this.workflowList) return;
            if (!this.workflowNodes.length) {
                const node = this.createWorkflowNode({
                    title: '默认任务',
                    summary: '等待输入',
                    signature: 'intent:general_chat',
                    intentName: 'general_chat',
                    tag: 'CHAT'
                });
                node.outputHtml = this.defaultWelcomeHtml;
                this.activeNodeId = node.id;
            }
            this.renderWorkflowNodes();
            this.applyActiveNodeOutput();
        }

        createManualNode() {
            const node = this.createWorkflowNode({
                title: `新任务 ${this.workflowNodes.length + 1}`,
                summary: '等待输入',
                signature: `manual:${Date.now()}`,
                tag: 'TASK'
            });
            node.outputHtml = this.defaultWelcomeHtml;
            this.switchNode(node.id, { skipSave: false });
        }

        createWorkflowNode({ title, summary, signature, intentName, flowId, tag }) {
            const id = `cli_task_${Date.now()}_${Math.random().toString(16).slice(2, 6)}`;
            const color = this.nodeColors[this.nodeColorIndex % this.nodeColors.length];
            this.nodeColorIndex += 1;
            const node = {
                id,
                sessionId: `web_cli_${id}`,
                color,
                title: title || '任务',
                summary: summary || '等待输入',
                signature: signature || null,
                intentName: intentName || null,
                flowId: flowId || null,
                tag: tag || 'TASK',
                important: false,
                manualTitle: false,
                createdAt: Date.now(),
                outputHtml: ''
            };
            this.workflowNodes.push(node);
            return node;
        }

        handleNodeAction(nodeId, action) {
            const node = this.workflowNodes.find((item) => item.id === nodeId);
            if (!node) return;
            if (action === 'rename') {
                const nextName = window.prompt('重命名任务', node.title);
                if (nextName && nextName.trim()) {
                    node.title = nextName.trim();
                    node.manualTitle = true;
                    this.renderWorkflowNodes();
                    this.updateNodeStatusBadge(node);
                }
                return;
            }
            if (action === 'pin') {
                node.important = !node.important;
                this.renderWorkflowNodes();
                return;
            }
            if (action === 'delete') {
                const confirmed = window.confirm('确定删除该任务节点？');
                if (!confirmed) return;
                const index = this.workflowNodes.findIndex((item) => item.id === nodeId);
                if (index === -1) return;
                this.workflowNodes.splice(index, 1);
                if (this.activeNodeId === nodeId) {
                    const fallback = this.workflowNodes[index] || this.workflowNodes[index - 1];
                    if (fallback) {
                        this.switchNode(fallback.id, { skipSave: true });
                    } else {
                        this.createManualNode();
                    }
                } else {
                    this.renderWorkflowNodes();
                }
            }
        }

        renderWorkflowNodes() {
            if (!this.workflowList) return;
            this.workflowList.innerHTML = this.workflowNodes.map((node, index) => {
                const activeClass = node.id === this.activeNodeId ? 'active' : '';
                const importantClass = node.important ? 'cli-node__action--important' : '';
                return `
                    <div class="cli-node ${activeClass}" data-node-id="${node.id}" style="--node-accent: ${node.color || '#ea7048'}">
                        <div class="cli-node__row">
                            <div class="cli-node__identity">
                                <span class="cli-node__dot"></span>
                                <span class="cli-node__index">#${index + 1}</span>
                                <span class="cli-node__title">${this.escapeHtml(node.title)}</span>
                            </div>
                            <span class="cli-node__tag">${this.escapeHtml(node.tag || 'TASK')}</span>
                        </div>
                        <div class="cli-node__summary">${this.escapeHtml(node.summary || '等待输入')}</div>
                        <div class="cli-node__row">
                            <div class="cli-node__actions">
                                <button type="button" class="cli-node__action cli-node__action--rename" data-node-action="rename" title="重命名">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                                        <path d="M4 20h4l10-10-4-4L4 16v4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                                        <path d="M14 6l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                                    </svg>
                                </button>
                                <button type="button" class="cli-node__action cli-node__action--pin ${importantClass}" data-node-action="pin" title="标记重要">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                                        <path d="M12 3l2.7 5.5 6.1.9-4.4 4.2 1 6.1L12 17.8 6.6 19.7l1-6.1-4.4-4.2 6.1-.9L12 3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                                    </svg>
                                </button>
                                <button type="button" class="cli-node__action cli-node__action--delete" data-node-action="delete" title="删除">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                                        <path d="M5 7h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                                        <path d="M9 7V5h6v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                                        <path d="M8 7l1 12h6l1-12" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        applyActiveNodeOutput() {
            const node = this.getActiveNode();
            if (!node || !this.output) return;
            this.output.innerHTML = node.outputHtml || this.defaultWelcomeHtml;
            this.updateNodeStatusBadge(node);
        }

        switchNode(nodeId, { skipSave } = {}) {
            if (this.activeNodeId === nodeId) return;
            const currentNode = this.getActiveNode();
            if (currentNode && !skipSave) {
                currentNode.outputHtml = this.output?.innerHTML || '';
            }
            const nextNode = this.workflowNodes.find((node) => node.id === nodeId);
            if (!nextNode) return;
            this.activeNodeId = nodeId;
            if (this.output) {
                this.output.innerHTML = nextNode.outputHtml || this.defaultWelcomeHtml;
            }
            this.renderWorkflowNodes();
            this.updateNodeStatusBadge(nextNode);
            this.scrollToBottom();
        }

        updateNodeStatusBadge(node) {
            if (!this.nodeStatus) return;
            const label = node?.title || '默认任务';
            this.nodeStatus.textContent = `任务: ${label}`;
        }

        getActiveNode() {
            return this.workflowNodes.find((node) => node.id === this.activeNodeId) || null;
        }

        getActiveSessionId() {
            return this.getActiveNode()?.sessionId || 'web_cli';
        }

        async loadBootstrapData() {
            await Promise.allSettled([this.loadModels(), this.loadFlows()]);
            this.renderSuggestions();
        }

        async loadModels() {
            try {
                const response = await fetch('/api/cli/models', { headers: this.buildHeaders() });
                const payload = await response.json();
                this.modelData = payload?.data || { providers: [], default_provider: null };
                this.populateProviderOptions();
                this.refreshModelOptions();
                this.providerStatus.textContent = 'AI: 可用';
            } catch (error) {
                this.providerStatus.textContent = 'AI: 模型列表加载失败';
            }
        }

        async loadFlows() {
            try {
                const response = await fetch('/api/cli/flows', { headers: this.buildHeaders() });
                const payload = await response.json();
                this.flowData = payload?.data || { flows: [] };
            } catch (error) {
                this.flowData = { flows: [] };
            }
        }

        populateProviderOptions() {
            const providers = this.modelData.providers || [];
            this.providerSelect.innerHTML = providers.map((provider) => (
                `<option value="${provider.id}">${this.escapeHtml(provider.id)}</option>`
            )).join('');

            if (this.modelData.default_provider) {
                this.providerSelect.value = this.modelData.default_provider;
            } else if (providers[0]) {
                this.providerSelect.value = providers[0].id;
            }
        }

        refreshModelOptions() {
            const providerId = this.providerSelect?.value;
            const provider = (this.modelData.providers || []).find((item) => item.id === providerId);
            const allModels = provider?.models || [];
            const models = allModels.filter((model) => {
                const modelType = model.type || 'chat';
                return modelType !== 'ocr';
            });
            this.modelSelect.innerHTML = models.map((model) => {
                const modelId = model.id || model;
                const modelName = model.name || modelId;
                return `<option value="${this.escapeHtml(modelId)}">${this.escapeHtml(modelName)}</option>`;
            }).join('');

            if (provider?.default_model) {
                this.modelSelect.value = provider.default_model;
            }
        }

        buildHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            const model = this.modelSelect?.value || null;

            if (typeof window.getProviderHeaders === 'function') {
                return Object.assign(headers, window.getProviderHeaders(model) || {});
            }

            const getUserItem = typeof window.getUserStorageItem === 'function'
                ? window.getUserStorageItem.bind(window)
                : (key) => localStorage.getItem(key);

            const provider = this.providerSelect?.value || window.appState?.provider || 'zhipu';
            const zhipuApiKey = window.appState?.apiKey || getUserItem('api_key') || getUserItem('globalApiKey');
            const aliyunApiKey = window.appState?.aliyunApiKey || getUserItem('aliyun_api_key');
            const useAliyun = provider === 'aliyun' || (model && /^(qwen|qwq|deepseek|kimi|minimax)/i.test(model));

            if (zhipuApiKey) {
                headers['X-Zhipu-API-Key'] = zhipuApiKey;
            }
            if (useAliyun && aliyunApiKey) {
                headers['X-LLM-Provider'] = 'aliyun';
                headers['X-Aliyun-API-Key'] = aliyunApiKey;
                headers.Authorization = `Bearer ${aliyunApiKey}`;
            } else if (zhipuApiKey) {
                headers.Authorization = `Bearer ${zhipuApiKey}`;
            }

            return headers;
        }

        renderRichText(text) {
            const content = text == null ? '' : String(text);
            if (typeof window.marked !== 'undefined') {
                try {
                    return window.marked.parse(content, { gfm: true, breaks: true });
                } catch (error) {
                    return this.escapeHtml(content);
                }
            }
            return this.escapeHtml(content);
        }
        async handleFileSelect(event) {
            const file = event?.target?.files?.[0];
            if (!file) return;

            this.pendingAttachment = await this.buildAttachmentPayload(file);
            this.renderAttachmentChip();
            this.printTrace(`已选择附件: ${file.name}`);
            if (this.pendingAttachment?.kind === 'pdf_pages') {
                this.openPagePicker();
            }
            const isExcel = /\.(xlsx|xls)$/i.test(file.name || '');
            const hint = isExcel
                ? '处理 Excel 文件后可使用 flow launch claims_excel_pipeline'
                : '解析 PDF 文件后可使用 flow launch pdf_ocr_pipeline';
            this.printBlock('处理文件', hint);
        }

        async buildAttachmentPayload(file) {
            const lowerName = (file.name || '').toLowerCase();
            const mimeType = file.type || '';

            if (mimeType === 'application/pdf' || lowerName.endsWith('.pdf')) {
                const pages = await this.convertPdfToImages(file);
                const selectedPages = pages.map((item) => item.page);
                return {
                    name: file.name,
                    size: file.size,
                    mime_type: mimeType || 'application/pdf',
                    kind: 'pdf_pages',
                    page_count: pages.length,
                    pages,
                    selected_pages: selectedPages,
                    selected_page_label: this.formatPageSelectionLabel(selectedPages, pages.length)
                };
            }

            const dataUrl = await this.readFileAsDataUrl(file);
            return {
                name: file.name,
                size: file.size,
                mime_type: mimeType,
                kind: 'file',
                data: dataUrl
            };
        }

        readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('文件读取失败'));
                reader.readAsDataURL(file);
            });
        }

        async ensurePdfJs() {
            if (typeof window.pdfjsLib !== 'undefined') {
                return window.pdfjsLib;
            }

            await new Promise((resolve, reject) => {
                const existing = document.querySelector('script[data-cli-pdfjs]');
                if (existing) {
                    existing.addEventListener('load', () => resolve(), { once: true });
                    existing.addEventListener('error', () => reject(new Error('PDF.js 加载失败')), { once: true });
                    return;
                }

                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                script.dataset.cliPdfjs = 'true';
                script.onload = resolve;
                script.onerror = () => reject(new Error('PDF.js 加载失败'));
                document.head.appendChild(script);
            });

            if (window.pdfjsLib) {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }

            return window.pdfjsLib;
        }

        async convertPdfToImages(file) {
            const pdfjsLib = await this.ensurePdfJs();
            const arrayBuffer = await file.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;
            const pages = [];

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum += 1) {
                const page = await pdf.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.6 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: context, viewport }).promise;
                pages.push({
                    page: pageNum,
                    data: canvas.toDataURL('image/png', 0.92),
                    mime_type: 'image/png'
                });
            }

            return pages;
        }

        formatPageSelectionLabel(selectedPages, totalPages) {
            if (!totalPages) return '加载中...';
            if (!Array.isArray(selectedPages) || !selectedPages.length || selectedPages.length >= totalPages) {
                return `共 ${totalPages} 页`;
            }
            return `${selectedPages.length}/${totalPages} 页: ${selectedPages.join(", ")}`;
        }


        parsePageRangeInput(rawValue, totalPages) {
            const values = [];
            const seen = new Set();
            const segments = String(rawValue || '').split(',').map((item) => item.trim()).filter(Boolean);
            for (const segment of segments) {
                if (segment.includes('-')) {
                    const [startRaw, endRaw] = segment.split('-', 2);
                    const start = Number.parseInt(startRaw, 10);
                    const end = Number.parseInt(endRaw, 10);
                    if (!Number.isInteger(start) || !Number.isInteger(end) || start < 1 || end < start || end > totalPages) {
                        throw new Error(`页码无效: ${segment}`);
                    }
                    for (let page = start; page <= end; page += 1) {
                        if (!seen.has(page)) {
                            seen.add(page);
                            values.push(page);
                        }
                    }
                    continue;
                }

                const page = Number.parseInt(segment, 10);
                if (!Number.isInteger(page) || page < 1 || page > totalPages) {
                        throw new Error(`无效页码: ${segment}`);
                }
                if (!seen.has(page)) {
                    seen.add(page);
                    values.push(page);
                }
            }

            if (!values.length) {
                throw new Error('预测IPC分类文件');
            }
            return values;
        }

        openPagePicker() {
            if (!this.pendingAttachment || this.pendingAttachment.kind !== 'pdf_pages') return;
            const totalPages = this.pendingAttachment.page_count || (this.pendingAttachment.pages || []).length || 0;
            const selectedPages = this.pendingAttachment.selected_pages || [];
            const isAllPages = !selectedPages.length || selectedPages.length >= totalPages;
            if (this.pagePickerDesc) {
                this.pagePickerDesc.textContent = `加载中文件 ${totalPages} 基于刚才专利结果分析创新点文件`;
            }
            if (this.pagePickerMode) {
                this.pagePickerMode.value = isAllPages ? 'all' : 'custom';
            }
            if (this.pagePickerInput) {
                this.pagePickerInput.value = isAllPages ? '' : selectedPages.join(',');
            }
            this.syncPagePickerMode();
            this.pagePicker?.classList.remove('hidden');
        }

        closePagePicker() {
            this.pagePicker?.classList.add('hidden');
        }

        syncPagePickerMode() {
            const isCustom = this.pagePickerMode?.value === 'custom';
            if (this.pagePickerInputWrap) {
                this.pagePickerInputWrap.style.display = isCustom ? 'flex' : 'none';
            }
        }
        applyPageSelection() {
            if (!this.pendingAttachment || this.pendingAttachment.kind !== 'pdf_pages') {
                this.closePagePicker();
                return;
            }

            try {
                const totalPages = this.pendingAttachment.page_count || (this.pendingAttachment.pages || []).length || 0;
                let selectedPages = Array.from({ length: totalPages }, (_, index) => index + 1);
                if (this.pagePickerMode?.value === 'custom') {
                    selectedPages = this.parsePageRangeInput(this.pagePickerInput?.value || '', totalPages);
                }

                this.pendingAttachment.selected_pages = selectedPages;
                this.pendingAttachment.selected_page_label = this.formatPageSelectionLabel(selectedPages, totalPages);
                this.renderAttachmentChip();
                this.closePagePicker();
                this.printTrace(`PDF 预测IPC分类: ${this.pendingAttachment.selected_page_label}`);
            } catch (error) {
                this.printError(error.message || '页码范围鏃犳晥');
            }
        }

        getRequestAttachment() {
            if (!this.pendingAttachment) return null;
            return {
                ...this.pendingAttachment,
                selected_pages: this.pendingAttachment.selected_pages || [],
                selected_page_label: this.pendingAttachment.selected_page_label || null
            };
        }
        renderAttachmentChip() {
            document.getElementById('cli-file-chip')?.remove();
            if (!this.pendingAttachment) return;

            const chip = document.createElement('div');
            chip.id = 'cli-file-chip';
            chip.className = 'cli-file-chip';
            const pageInfo = this.pendingAttachment?.page_count ? ` (${this.pendingAttachment.page_count} 页)` : '';
            const selectionLabel = this.pendingAttachment?.selected_page_label || '';
            chip.innerHTML = `
                <span>文件: ${this.escapeHtml(this.pendingAttachment.name || 'file')}${this.escapeHtml(pageInfo)}</span>
                ${selectionLabel ? `<span class="cli-file-chip__meta">文件: ${this.escapeHtml(selectionLabel)}</span>` : ''}
                ${this.pendingAttachment?.kind === 'pdf_pages' ? '<button type="button" data-pick-pages>文件</button>' : ''}
                <button type="button" data-clear-file>文件</button>
            `;
            this.output.appendChild(chip);
            chip.querySelector('[data-pick-pages]')?.addEventListener('click', () => this.openPagePicker());
            chip.querySelector('[data-clear-file]')?.addEventListener('click', () => {
                this.pendingAttachment = null;
                if (this.fileInput) {
                    this.fileInput.value = '';
                }
                chip.remove();
                this.closePagePicker();
                this.printTrace('已清除附件');
            });
            this.scrollToBottom();
        }

        async executeCommand() {
            if (this.isStreaming) return;
            if (!this.getActiveNode()) {
                this.initWorkflowBar();
            }
            
            const rawValue = (this.input?.value || '').trim();
            const defaultAttachmentCommand = this.pendingAttachment?.name && /\.(xlsx|xls)$/i.test(this.pendingAttachment.name)
                ? '处理 Excel'
                : '解析文档';
            const value = rawValue || (this.pendingAttachment ? defaultAttachmentCommand : '');
            if (!value) return;

            this.input.value = '';
            this.pushHistory(value);
            this.renderSuggestions([]);
            this.commandSnapshot = {
                nodeId: this.activeNodeId,
                previousHtml: this.output?.innerHTML || '',
                command: value
            };
            this.printLine(`> ${value}`, 'command');
            this.setStreamingState(true);
            this.showLoading();

            try {
                const streamed = await this.executeCommandStream(value);
                if (!streamed) {
                    await this.executeCommandFallback(value);
                }
            } catch (error) {
                this.hideLoading();
                this.setStreamingState(false);
                this.printError(`网络错误: ${error.message}`);
                this.commandSnapshot = null;
            }
        }

        async executeCommandStream(value) {
            const response = await fetch('/api/cli/stream', {
                method: 'POST',
                headers: this.buildHeaders(),
                body: JSON.stringify({
                    input: value,
                    session_id: this.getActiveSessionId(),
                    provider: this.providerSelect?.value || null,
                    model: this.modelSelect?.value || null,
                    attachment: this.getRequestAttachment(),
                    ocr_engine: this.ocrEngineSelect?.value || null
                })
            });

            if (!response.ok || !response.body) {
                return false;
            }

            this.currentStreamAnswer = '';
            const decoder = new TextDecoder('utf-8');
            this.currentReader = response.body.getReader();
            let buffer = '';
            let receivedAny = false;

            try {
                while (true) {
                    if (!this.isStreaming) {
                        this.currentReader.cancel();
                        break;
                    }
                    const { value: chunk, done } = await this.currentReader.read();
                    if (done) break;
                    receivedAny = true;
                    buffer += decoder.decode(chunk, { stream: true });

                    let boundaryIndex = buffer.indexOf('\n\n');
                    while (boundaryIndex !== -1) {
                        const rawEvent = buffer.slice(0, boundaryIndex);
                        buffer = buffer.slice(boundaryIndex + 2);
                        this.consumeSSEEvent(rawEvent);
                        boundaryIndex = buffer.indexOf('\n\n');
                    }
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error('Stream error:', error);
                }
            }

            this.hideLoading();
            this.setStreamingState(false);
            this.currentReader = null;
            return receivedAny;
        }

        async executeCommandFallback(value) {
            const response = await fetch('/api/cli/execute', {
                method: 'POST',
                headers: this.buildHeaders(),
                body: JSON.stringify({
                    input: value,
                    mode: 'auto',
                    session_id: this.getActiveSessionId(),
                    provider: this.providerSelect?.value || null,
                    model: this.modelSelect?.value || null,
                    attachment: this.getRequestAttachment(),
                    ocr_engine: this.ocrEngineSelect?.value || null
                })
            });

            const payload = await response.json();
            this.hideLoading();

            if (!payload.success) {
                this.printError(payload.error || '执行失败');
                this.commandSnapshot = null;
                return;
            }

            this.renderPayload(payload.data || {});
        }

        consumeSSEEvent(rawEvent) {
            const line = rawEvent.split('\n').find((item) => item.startsWith('data: '));
            if (!line) return;

            const data = line.slice(6);
            if (data === '[DONE]') {
                this.hideLoading();
                return;
            }

            try {
                this.handleStreamEvent(JSON.parse(data));
            } catch (error) {
                this.printError('流式响应解析失败');
            }
        }
        handleStreamEvent(event) {
            if (!event?.type) return;

            if (event.type === 'trace') {
                this.updateProgress(event.progress || null, event.message || event.stage || '加载中');
                this.printTrace(event.message || event.stage || '加载中');
                return;
            }

            if (event.type === 'context') {
                this.updateProgress({ percent: 72, label: 'Context updated' }, event.message || '加载中加载中');
                this.printTrace(event.message || '加载中加载中');
                if (Array.isArray(event.scraped_patents) && event.scraped_patents.length) {
                    this.renderPatentContext(event.scraped_patents);
                }
                if (Array.isArray(event.scrape_errors) && event.scrape_errors.length) {
                    this.printBlock('抓取异常', event.scrape_errors.map((item) => `${item.patent_number || 'unknown'}: ${item.error || '抓取失败'}`).join('\n'));
                }
                return;
            }

            if (event.type === 'content') {
                this.updateProgress({ percent: 88, label: 'Generating answer' }, '预测IPC分类');
                this.appendStreamAnswer(event.delta || '');
                return;
            }

            if (event.type === 'final') {
                this.updateProgress({ percent: 100, label: 'Completed' }, '处理完成');
                this.hideLoading();
                this.renderPayload(event.data || {});
                return;
            }

            if (event.type === 'error') {
                this.hideLoading();
                this.printError(event.error || '执行失败');
                this.commandSnapshot = null;
            }
        }

        renderPayload(payload) {
            this.finalizeWorkflowSwitch(payload);
            document.getElementById('cli-stream-answer')?.remove();
            this.currentStreamAnswer = '';

            if (payload.mode === 'legacy_cli_command' && payload.result) {
                this.renderLegacyResult(payload.result);
                return;
            }

            if (payload.type === 'embedded_flow' || payload.data?.flow_id) {
                this.renderFlowCard(payload.data || payload);
                return;
            }

            if (payload.type !== 'cli_orchestration' && payload.data?.type === 'cli_orchestration') {
                this.renderOrchestration(payload.data);
                return;
            }

            if (payload.type === 'cli_orchestration') {
                this.renderOrchestration(payload);
                return;
            }

            if (payload.result?.data || payload.result?.message) {
                this.renderLegacyResult(payload.result);
                return;
            }

            this.printBlock('返回结果', JSON.stringify(payload, null, 2));
        }

        finalizeWorkflowSwitch(payload) {
            if (!this.commandSnapshot) return;
            const taskMeta = this.extractTaskMeta(payload);
            if (!taskMeta.signature) {
                this.commandSnapshot = null;
                return;
            }
            const activeNode = this.getActiveNode();
            const shouldSwitch = this.shouldCreateNewNode(taskMeta.signature, taskMeta.intentName);
            if (shouldSwitch) {
                const newNode = this.createWorkflowNode(taskMeta);
                newNode.outputHtml = this.output?.innerHTML || '';
                if (this.commandSnapshot.nodeId) {
                    const prevNode = this.workflowNodes.find((node) => node.id === this.commandSnapshot.nodeId);
                    if (prevNode) {
                        prevNode.outputHtml = this.commandSnapshot.previousHtml || this.defaultWelcomeHtml;
                    }
                }
                this.activeNodeId = newNode.id;
                this.renderWorkflowNodes();
                this.updateNodeStatusBadge(newNode);
            } else if (activeNode) {
                this.updateNodeFromPayload(activeNode, taskMeta);
            }
            this.commandSnapshot = null;
        }

        shouldCreateNewNode(signature, intentName) {
            const activeNode = this.getActiveNode();
            if (!activeNode) return true;
            if (intentName === 'context_follow_up') return false;
            if (!signature) return false;
            return activeNode.signature !== signature;
        }

        extractTaskMeta(payload) {
            const meta = {
                title: '',
                summary: '',
                signature: null,
                intentName: null,
                flowId: null,
                tag: 'TASK'
            };

            const commandText = this.commandSnapshot?.command || '';
            const fallbackSummary = commandText ? commandText.slice(0, 32) : '等待输入';

            const orchestration = payload?.type === 'cli_orchestration'
                ? payload
                : payload?.data?.type === 'cli_orchestration'
                    ? payload.data
                    : null;

            if (orchestration) {
                const intentName = orchestration.intent || 'general_chat';
                meta.intentName = intentName;
                meta.signature = `intent:${intentName}`;
                meta.tag = this.getIntentTag(intentName);
                meta.title = this.getIntentTitle(intentName);
                const input = orchestration.input || commandText;
                meta.summary = input ? input.slice(0, 36) : fallbackSummary;
                return meta;
            }

            const flowData = payload?.type === 'embedded_flow' || payload?.data?.flow_id
                ? (payload.data?.flow_id ? payload.data : payload)
                : payload?.result?.data?.flow_id
                    ? payload.result.data
                    : null;

            if (flowData) {
                const flowId = flowData.flow_id || flowData.id || 'flow';
                meta.flowId = flowId;
                meta.signature = `flow:${flowId}`;
                meta.tag = 'FLOW';
                meta.title = this.getFlowTitle(flowId);
                meta.summary = flowData.description || flowData.title || fallbackSummary;
                return meta;
            }

            return {
                ...meta,
                summary: fallbackSummary,
                title: '任务'
            };
        }

        updateNodeFromPayload(node, meta) {
            if (!node) return;
            if (meta.signature) node.signature = meta.signature;
            if (meta.intentName) node.intentName = meta.intentName;
            if (meta.flowId) node.flowId = meta.flowId;
            if (meta.tag) node.tag = meta.tag;
            if (!node.manualTitle && meta.title) {
                node.title = meta.title;
            }
            if (meta.summary) {
                node.summary = meta.summary;
            }
            this.renderWorkflowNodes();
            this.updateNodeStatusBadge(node);
        }

        getFlowTitle(flowId) {
            const mapping = {
                patent_lookup: '专利查询',
                patent_family_compare: '同族对比',
                claims_pipeline: '权利要求分析',
                claims_excel_pipeline: 'Claims Excel',
                pdf_ocr_pipeline: 'PDF OCR',
                ipc_lookup: 'IPC 检索',
                ipc_predict: 'IPC 预测'
            };
            return mapping[flowId] || `流程 ${flowId}`;
        }

        getIntentTitle(intentName) {
            const mapping = {
                patent_detail: '专利详情',
                patent_qa: '专利问答',
                patent_lookup: '专利查询',
                context_follow_up: '上下文追问',
                general_chat: '自由对话',
                model_listing: '模型列表'
            };
            return mapping[intentName] || '任务对话';
        }

        getIntentTag(intentName) {
            const mapping = {
                patent_detail: 'DETAIL',
                patent_qa: 'QA',
                patent_lookup: 'LOOK',
                context_follow_up: 'FOLLOW',
                general_chat: 'CHAT',
                model_listing: 'MODEL'
            };
            return mapping[intentName] || 'TASK';
        }

        renderLegacyResult(result) {
            if (result.message) this.printBlock('执行结果', result.message);
            if (result.data) {
                if (result.type === 'embedded_flow' || result.data?.flow_id) {
                    this.renderFlowCard(result.data || result);
                } else {
                    this.printBlock('数据', JSON.stringify(result.data, null, 2));
                }
            }
            if (result.error) this.printError(result.error);
            if (Array.isArray(result.suggestions) && result.suggestions.length) {
                this.renderSuggestions(result.suggestions);
            }
        }

        renderOrchestration(data) {
            if (data.summary) {
                this.printBlock(data.summary.title || '执行摘要', (data.summary.lines || []).join('\n'));
            }

            if (data.routing) {
                this.printBlock('模型路由', `Provider: ${data.routing.provider || '-'}\nModel: ${data.routing.model || '-'}`);
            }

            if (Array.isArray(data.detected_patents) && data.detected_patents.length) {
                this.printBlock('预测IPC分类', data.detected_patents.join('\\n'));
            }

            if (Array.isArray(data.trace) && data.trace.length) {
                this.printBlock('执行轨迹', data.trace.join('\n'));
            }

            if (Array.isArray(data.scraped_patents) && data.scraped_patents.length) {
                this.renderPatentContext(data.scraped_patents);
            }

            if (Array.isArray(data.scrape_errors) && data.scrape_errors.length) {
                this.printBlock('抓取异常', data.scrape_errors.map((item) => `${item.patent_number || 'unknown'}: ${item.error || '抓取失败'}`).join('\n'));
            }

            if (data.stats && Object.keys(data.stats).length) {
                const usage = data.stats.usage || {};
                const lines = [
                    `总耗时: ${this.formatDuration(data.stats.duration_ms)}`,
                    `上下文专利数: ${data.stats.context_patents || 0}`,
                    `抓取失败数: ${data.stats.scrape_error_count || 0}`,
                    `Prompt Tokens: ${usage.prompt_tokens || 0}`,
                    `Completion Tokens: ${usage.completion_tokens || 0}`,
                    `Total Tokens: ${usage.total_tokens || 0}`
                ];
                if (data.stats.fallback_used) {
                    lines.push('回退: 是');
                    if (data.stats.fallback_reason) {
                        lines.push(`回退原因: ${data.stats.fallback_reason}`);
                    }
                }
                this.printBlock('执行统计', lines.join('\n'));
            }

            if (data.qa?.answer) {
                this.printBlock('AI 解答', data.qa.answer);
            }

            if (data.qa?.error) {
                this.printError(data.qa.error);
            }
        }

        renderPatentContext(patents) {
            const wrapper = document.createElement('details');
            wrapper.className = 'cli-details';
            wrapper.open = true;
            wrapper.innerHTML = '<summary>专利上下文</summary><div class="cli-details__body"></div>';
            const body = wrapper.querySelector('.cli-details__body');
            patents.forEach((patent) => body?.appendChild(this.createPatentCard(patent)));
            this.output.appendChild(wrapper);
            this.scrollToBottom();
        }

        renderFlowCard(flow) {
            const data = flow?.data?.flow_id ? flow.data : flow;
            const card = document.createElement('div');
            card.className = 'cli-flow-card';
            const steps = Array.isArray(data.steps) ? data.steps.join('\n') : '';
            const outputs = Array.isArray(data.outputs)
                ? data.outputs.map((item) => (
                    `<div class="cli-divider"></div><div class="cli-kv"><strong>${this.escapeHtml(item.title || '结果')}:</strong><div class="cli-markdown">${this.renderRichText(item.text || '')}</div></div>`
                )).join('')
                : '';
            card.innerHTML = `
                <div class="cli-flow-card__title">${this.escapeHtml(data.title || data.flow_id || '服务流程')}</div>
                <div class="cli-flow-card__meta">${this.escapeHtml(data.flow_id || '')}</div>
                <div class="cli-kv"><strong>说明:</strong> ${this.escapeHtml(data.description || '-')}</div>
                ${data.api_endpoint ? `<div class="cli-kv"><strong>端点</strong> ${this.escapeHtml(data.api_endpoint)}</div>` : ''}
                ${steps ? `<div class="cli-divider"></div><div class="cli-kv"><strong>步骤</strong>\n${this.escapeHtml(steps)}</div>` : ''}
                ${outputs}
            `;
            this.output.appendChild(card);
            this.scrollToBottom();
        }

        appendStreamAnswer(delta) {
            this.currentStreamAnswer += delta;
            let block = document.getElementById('cli-stream-answer');
            if (!block) {
                block = document.createElement('div');
                block.id = 'cli-stream-answer';
                block.className = 'cli-block';
                block.innerHTML = '<div class="cli-block__title">AI 解答生成中</div><div class="cli-block__text cli-markdown" data-stream-text></div>';
                this.output.appendChild(block);
            }

            const textNode = block.querySelector('[data-stream-text]');
            if (textNode) {
                textNode.innerHTML = this.renderRichText(this.currentStreamAnswer);
            }
            this.scrollToBottom();
        }

        printTrace(message) {
            this.printLine(`[trace] ${message}`, 'muted');
        }

        printBlock(title, text) {
            const block = document.createElement('div');
            block.className = 'cli-block';
            block.innerHTML = `<div class="cli-block__title">${this.escapeHtml(title)}</div><div class="cli-block__text cli-markdown">${this.renderRichText(text)}</div>`;
            this.output.appendChild(block);
            this.scrollToBottom();
        }

        printLine(text, type) {
            const line = document.createElement('div');
            line.className = `cli-line cli-line--${type || 'muted'}`;
            line.textContent = text;
            this.output.appendChild(line);
            this.scrollToBottom();
        }

        printError(text) {
            this.printLine(text, 'error');
        }

        showLoading() {
            this.hideLoading();
            this.progressStartedAt = Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = 'cli-loading';
            wrapper.className = 'cli-block';
            wrapper.innerHTML = `
                <div class="cli-block__title">加载中</div>
                <div class="cli-progress">
                    <div class="cli-progress__meta">
                        <span data-progress-label>Preparing request</span>
                        <span data-progress-time>0s</span>
                    </div>
                    <div class="cli-progress__bar">
                        <div class="cli-progress__fill indeterminate" data-progress-fill></div>
                    </div>
                    <div class="cli-progress__hint" data-progress-hint>预测IPC分类加载中加载中</div>
                </div>
            `;
            this.output.appendChild(wrapper);
            this.progressTimer = window.setInterval(() => {
                const timeNode = wrapper.querySelector('[data-progress-time]');
                if (timeNode) {
                    timeNode.textContent = this.formatDuration(Date.now() - this.progressStartedAt);
                }
            }, 500);
            this.scrollToBottom();
        }

        updateProgress(progress, hintText) {
            const wrapper = document.getElementById('cli-loading');
            if (!wrapper) {
                this.showLoading();
            }
            const panel = document.getElementById('cli-loading');
            if (!panel) return;
            const fill = panel.querySelector('[data-progress-fill]');
            const label = panel.querySelector('[data-progress-label]');
            const hint = panel.querySelector('[data-progress-hint]');
            if (label) {
                label.textContent = progress?.label || 'Processing';
            }
            if (hint && hintText) {
                hint.textContent = hintText;
            }
            if (fill) {
                const percent = Number.isFinite(progress?.percent) ? Math.max(0, Math.min(100, progress.percent)) : null;
                if (percent === null) {
                    fill.classList.add('indeterminate');
                    fill.style.width = '32%';
                } else {
                    fill.classList.remove('indeterminate');
                    fill.style.width = `${percent}%`;
                }
            }
        }

        hideLoading() {
            if (this.progressTimer) {
                window.clearInterval(this.progressTimer);
                this.progressTimer = null;
            }
            document.getElementById('cli-loading')?.remove();
        }

        setStreamingState(streaming) {
            this.isStreaming = streaming;
            if (this.sendBtn) {
                this.sendBtn.style.display = streaming ? 'none' : 'block';
            }
            if (this.stopBtn) {
                this.stopBtn.style.display = streaming ? 'flex' : 'none';
            }
        }

        stopStreaming() {
            if (this.currentReader) {
                this.isStreaming = false;
                this.currentReader.cancel();
                this.currentReader = null;
            }
            this.setStreamingState(false);
            this.hideLoading();
            this.printLine('[已停止', 'muted');
            this.commandSnapshot = null;
        }

        renderSuggestions(custom) {
            const text = (this.input?.value || '').trim().toLowerCase();
            const flowExamples = (this.flowData.flows || []).flatMap((flow) => flow.entry_examples || []);
            const defaults = Array.isArray(custom) && custom.length
                ? custom
                : [...new Set([...this.suggestionDefaults, ...flowExamples])];
            const items = text ? defaults.filter((item) => item.toLowerCase().includes(text)) : defaults;

            if (!items.length) {
                this.suggestions.style.display = 'none';
                this.suggestions.innerHTML = '';
                return;
            }

            this.suggestions.style.display = 'flex';
            this.suggestions.innerHTML = items.slice(0, 8).map((item) => (
                `<button type="button" class="cli-chip" data-suggestion="${this.escapeHtml(item)}">${this.escapeHtml(item)}</button>`
            )).join('');

            this.suggestions.querySelectorAll('[data-suggestion]').forEach((node) => {
                node.addEventListener('click', () => {
                    const suggestion = node.getAttribute('data-suggestion') || '';
                    this.input.value = suggestion;
                    this.input.focus();
                    this.renderSuggestions([]);
                    this.showSuggestionGuide(suggestion);
                });
            });
        }

        showSuggestionGuide(suggestion) {
            const guideConfig = this.getGuideConfig(suggestion);
            if (!guideConfig) {
                return;
            }
            if (guideConfig.autoExecute) {
                this.executeCommand();
                return;
            }
            this.printGuideBlock(guideConfig);
        }

        getGuideConfig(suggestion) {
            const lowerSuggestion = (suggestion || '').toLowerCase();
            
            if (lowerSuggestion.includes('预测ipc') || lowerSuggestion.includes('ipc分类')) {
                return {
                    title: '预测IPC分类',
                    description: '请输入您需要预测IPC分类的技术内容，系统将为您分析并预测合适的IPC分类号。',
                    placeholder: '例如：一种基于深度学习的图像识别方法',
                    inputHint: '请输入技术内容描述：',
                    example: '预测IPC分类 一种基于深度学习的图像识别方法',
                    requiresInput: true
                };
            }
            
            if (lowerSuggestion.includes('对比分析') || lowerSuggestion.includes('与') && lowerSuggestion.includes('专利')) {
                return {
                    title: '专利对比分析',
                    description: '请输入两个需要对比分析的专利号，系统将为您分析两件专利的差异和关联。',
                    placeholder: 'CN104154208B US12390907B2',
                    inputHint: '请输入专利号A和专利号B（用空格分隔）：',
                    example: '查询 CN104154208B 与 US12390907B2 对比分析',
                    requiresInput: true,
                    multiParam: true,
                    paramLabels: ['专利号A', '专利号B']
                };
            }
            
            if (lowerSuggestion.includes('专利详情') || lowerSuggestion.includes('查询') && /[A-Z]{2}\d+/i.test(suggestion)) {
                return {
                    title: '查询专利详情',
                    description: '请输入或修改需要查询的专利号，系统将为您获取专利的详细信息。',
                    placeholder: 'CN104154208B',
                    inputHint: '请输入专利号：',
                    example: '查询 CN104154208B 专利详情',
                    requiresInput: true,
                    patentNumber: suggestion.match(/[A-Z]{2}\d+[A-Z]?/i)?.[0] || ''
                };
            }
            
            if (lowerSuggestion.includes('处理 excel') || lowerSuggestion.includes('excel')) {
                return {
                    title: '处理Excel文件',
                    description: '请先上传Excel文件，然后输入处理指令。支持权利要求分析、数据提取等操作。',
                    placeholder: '处理 Excel',
                    inputHint: '请先上传Excel文件，然后输入处理需求：',
                    example: '处理 Excel',
                    requiresInput: true,
                    requiresFile: true
                };
            }
            
            if (lowerSuggestion.includes('创新点') || lowerSuggestion.includes('保护范围')) {
                return {
                    title: '专利分析',
                    description: '请先查询专利详情，然后可以基于查询结果分析创新点和保护范围。',
                    placeholder: '基于刚才专利结果分析创新点',
                    inputHint: '请确保已查询专利，然后输入分析需求：',
                    example: '基于刚才专利结果分析创新点',
                    requiresInput: false
                };
            }
            
            if (lowerSuggestion === 'flow list' || lowerSuggestion.includes('flow')) {
                return {
                    autoExecute: true
                };
            }
            
            return {
                title: '快捷指令',
                description: '您可以直接修改输入框中的内容，然后按回车或点击发送按钮执行。',
                requiresInput: false
            };
        }

        printGuideBlock(config) {
            document.getElementById('cli-guide-block')?.remove();
            
            const block = document.createElement('div');
            block.id = 'cli-guide-block';
            block.className = 'cli-block cli-block--guide';
            
            let paramInputsHtml = '';
            if (config.multiParam && config.paramLabels) {
                paramInputsHtml = config.paramLabels.map((label, index) => `
                    <div class="cli-guide__field">
                        <label class="cli-guide__label">${this.escapeHtml(label)}:</label>
                        <input type="text" class="cli-guide__input" data-param-index="${index}" placeholder="${index === 0 ? 'CN104154208B' : 'US12390907B2'}" />
                    </div>
                `).join('');
            } else if (config.requiresInput) {
                const inputValue = config.patentNumber || '';
                const placeholder = config.placeholder || '';
                paramInputsHtml = `
                    <div class="cli-guide__field">
                        <label class="cli-guide__label">${this.escapeHtml(config.inputHint || '请输入：')}</label>
                        <input type="text" class="cli-guide__input" data-single-param value="${this.escapeHtml(inputValue)}" placeholder="${this.escapeHtml(placeholder)}" />
                    </div>
                `;
            }
            
            const fileHint = config.requiresFile ? `
                <div class="cli-guide__file-hint">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" 
                              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>请先点击左侧附件按钮上传Excel文件</span>
                </div>
            ` : '';
            
            block.innerHTML = `
                <div class="cli-guide">
                    <div class="cli-guide__header">
                        <div class="cli-guide__icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                                <path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="cli-guide__title">${this.escapeHtml(config.title || '快捷指令')}</div>
                    </div>
                    <div class="cli-guide__desc">${this.escapeHtml(config.description || '')}</div>
                    ${fileHint}
                    ${paramInputsHtml}
                    <div class="cli-guide__example">
                        <span class="cli-guide__example-label">示例：</span>
                        <code class="cli-guide__example-code">${this.escapeHtml(config.example || '')}</code>
                    </div>
                    <div class="cli-guide__actions">
                        <button type="button" class="cli-guide__btn cli-guide__btn--ghost" data-guide-action="cancel">取消</button>
                        <button type="button" class="cli-guide__btn" data-guide-action="apply">确认执行</button>
                    </div>
                </div>
            `;
            
            this.output.appendChild(block);
            this.scrollToBottom();
            
            block.querySelector('[data-guide-action="cancel"]')?.addEventListener('click', () => {
                block.remove();
                this.input.value = '';
            });
            
            block.querySelector('[data-guide-action="apply"]')?.addEventListener('click', () => {
                this.applyGuideInput(block, config);
            });
            
            block.querySelectorAll('.cli-guide__input').forEach((input) => {
                input.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        this.applyGuideInput(block, config);
                    }
                });
            });
            
            const firstInput = block.querySelector('.cli-guide__input');
            if (firstInput) {
                firstInput.focus();
            }
        }

        applyGuideInput(block, config) {
            let finalCommand = '';
            
            if (config.multiParam && config.paramLabels) {
                const inputs = block.querySelectorAll('.cli-guide__input');
                const values = Array.from(inputs).map((input) => (input.value || '').trim()).filter(Boolean);
                
                if (values.length < 2) {
                    this.printError('请填写所有必填参数');
                    return;
                }
                
                finalCommand = `查询 ${values[0]} 与 ${values[1]} 对比分析`;
            } else if (config.patentNumber) {
                const patentInput = block.querySelector('.cli-guide__input');
                const patentNumber = (patentInput?.value || config.patentNumber).trim();
                if (!patentNumber) {
                    this.printError('请输入专利号');
                    return;
                }
                finalCommand = `查询 ${patentNumber} 专利详情`;
            } else if (config.requiresInput) {
                const singleInput = block.querySelector('[data-single-param]');
                const userInput = (singleInput?.value || '').trim();
                if (!userInput) {
                    this.printError('请输入必要的内容');
                    return;
                }
                if (config.title === '预测IPC分类') {
                    finalCommand = `预测IPC分类 ${userInput}`;
                } else {
                    finalCommand = userInput;
                }
            } else {
                finalCommand = this.input.value || config.example || '';
            }
            
            block.remove();
            
            if (finalCommand) {
                this.input.value = finalCommand;
                this.executeCommand();
            }
        }

        pushHistory(value) {
            this.history.push(value);
            this.historyIndex = this.history.length;
            localStorage.setItem('cli_history', JSON.stringify(this.history.slice(-100)));
        }

        loadHistory() {
            try {
                this.history = JSON.parse(localStorage.getItem('cli_history') || '[]');
                this.historyIndex = this.history.length;
            } catch (error) {
                this.history = [];
                this.historyIndex = 0;
            }
        }

        navigateHistory(direction) {
            if (!this.history.length || !this.input) return;
            this.historyIndex += direction;
            if (this.historyIndex < 0) this.historyIndex = 0;
            if (this.historyIndex >= this.history.length) {
                this.historyIndex = this.history.length;
                this.input.value = '';
                return;
            }
            this.input.value = this.history[this.historyIndex];
        }

        clearOutput() {
            this.output.innerHTML = '';
            const node = this.getActiveNode();
            if (node) {
                node.outputHtml = '';
            }
        }

        open() {
            if (!this.container) return;
            this.container.classList.remove('hidden', 'minimized');
            this.toggleFullscreen(false);
            this.launcher?.classList.add('hidden');
            this.applyActiveNodeOutput();
            this.input?.focus();
        }

        close() {
            if (!this.container) return;
            this.container.classList.remove('minimized');
            this.toggleFullscreen(false);
            this.container.classList.add('hidden');
            this.launcher?.classList.remove('hidden');
        }

        toggleMinimize() {
            this.close();
        }

        toggleFullscreen(force) {
            if (!this.container) return;
            this.container.classList.remove('minimized');
            const shouldOpen = typeof force === 'boolean' ? force : !this.container.classList.contains('fullscreen');
            this.container.classList.toggle('fullscreen', shouldOpen);
            document.body.style.overflow = shouldOpen ? 'hidden' : '';
            const expandBtn = document.getElementById('cli-btn-expand');
            if (expandBtn) {
                expandBtn.title = shouldOpen ? '收起' : '展开';
                if (shouldOpen) {
                    expandBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                        <path d="M4 2v3H2v5h5V8h3V2H4z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    </svg>`;
                } else {
                    expandBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                        <path d="M2 2h8v8H2V2z" stroke="currentColor" stroke-width="2" fill="none"/>
                    </svg>`;
                }
                expandBtn.setAttribute('title', shouldOpen ? '收起' : '展开');
                expandBtn.setAttribute('aria-label', shouldOpen ? '收起' : '展开');
            }
            this.scrollToBottom();
        }

        createPatentCard(patent) {
            const card = document.createElement('div');
            card.className = 'cli-patent-card';
            const claimsPreview = Array.isArray(patent.claims_preview) ? patent.claims_preview.join('\n\n') : '';
            card.innerHTML = `
                <div class="cli-patent-card__head">
                    <div>
                        <div class="cli-patent-card__title">${this.escapeHtml(patent.patent_number || '')}</div>
                        <div class="cli-patent-card__meta">${this.escapeHtml(patent.title || '未抓取到标题')}</div>
                    </div>
                    <div class="cli-patent-card__meta">${this.escapeHtml(patent.publication_date || '-')}</div>
                </div>
                <div class="cli-kv"><strong>申请日</strong> ${this.escapeHtml(patent.application_date || '-')}</div>
                <div class="cli-kv"><strong>申请人</strong> ${this.escapeHtml((patent.assignees || []).join(', ') || '-')}</div>
                <div class="cli-kv"><strong>发明人</strong> ${this.escapeHtml((patent.inventors || []).join(', ') || '-')}</div>
                <div class="cli-kv"><strong>摘要</strong> ${this.escapeHtml(patent.abstract || '-')}</div>
                <div class="cli-kv"><strong>权利要求数量:</strong> ${this.escapeHtml(String(patent.claims_count || 0))}</div>
                ${claimsPreview ? `<div class="cli-divider"></div><div class="cli-kv"><strong>权利要求预览</strong>\n${this.escapeHtml(claimsPreview)}</div>` : ''}
            `;
            return card;
        }

        formatDuration(durationMs) {
            const safe = Number(durationMs || 0);
            if (safe < 1000) return `${safe} ms`;
            return `${(safe / 1000).toFixed(2)} s`;
        }

        scrollToBottom() {
            if (this.output) {
                this.output.scrollTop = this.output.scrollHeight;
            }
        }

        escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }
    }

    window.cliAgent = new EmbeddedPatentCLI();
    setTimeout(() => window.cliAgent.init(), 100);
})();
</script>
