<div id="cli-agent-container" class="cli-shell hidden">
    <div class="cli-shell__header">
        <div>
            <div class="cli-shell__title">Patent CLI</div>
            <div class="cli-shell__subtitle">自然语言 -> 服务流程 -> 上下文问答</div>
        </div>
        <div class="cli-shell__actions">
            <button id="cli-btn-minimize" class="cli-shell__icon-btn cli-shell__icon-btn--minimize" title="最小化">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M2 6h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <button id="cli-btn-expand" class="cli-shell__icon-btn cli-shell__icon-btn--expand" title="全屏">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M2 2h8v8H2V2z" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
            </button>
            <button id="cli-btn-close" class="cli-shell__icon-btn cli-shell__icon-btn--close" title="关闭">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="cli-shell__toolbar">
        <label class="cli-field">
            <span>Provider</span>
            <select id="cli-provider-select"></select>
        </label>
        <label class="cli-field cli-field--wide">
            <span>Model</span>
            <select id="cli-model-select"></select>
        </label>
        <div id="cli-status-provider" class="cli-badge">AI: 初始化中</div>
        <div id="cli-status-node" class="cli-badge cli-badge--node">任务: 默认</div>
    </div>

    <div class="cli-shell__body">
        <aside class="cli-workflow">
            <div class="cli-workflow__header">
                <div>
                    <div class="cli-workflow__title">任务切换</div>
                    <div class="cli-workflow__subtitle">按主题分离上下文</div>
                </div>
                <button id="cli-node-create" class="cli-shell__icon-btn cli-workflow__create-btn" type="button" title="新建任务">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div id="cli-workflow-list" class="cli-workflow__list"></div>
        </aside>

        <div class="cli-shell__main">
            <div id="cli-output" class="cli-shell__output">
                <div class="cli-block cli-block--welcome">
                    <div class="cli-block__title">CLI 已就绪</div>
                    <div class="cli-block__text">示例: 查询 CN104154208B 专利详情</div>
                    <div class="cli-block__text">示例: 基于刚才专利结果分析创新点和保护范围</div>
                    <div class="cli-block__text">示例: flow list</div>
                    <div class="cli-block__text">上传文件后可直接输入：请解析这个文件 / 帮我识别这份 PDF / 总结这个文档。</div>
                </div>
            </div>

            <div id="cli-suggestions" class="cli-shell__suggestions"></div>

            <div class="cli-shell__inputbar">
                <span class="cli-shell__prompt">&gt;</span>
                <button id="cli-file-btn" class="cli-shell__attach" type="button" title="选择文件">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" 
                              stroke="currentColor" 
                              stroke-width="2" 
                              stroke-linecap="round" 
                              stroke-linejoin="round"/>
                    </svg>
                </button>
                <input id="cli-file-input" type="file" hidden />
                <input
                    id="cli-input"
                    class="cli-shell__input"
                    type="search"
                    name="cli_query_input"
                    autocomplete="off"
                    autocapitalize="off"
                    autocorrect="off"
                    data-lpignore="true"
                    data-1p-ignore="true"
                    spellcheck="false"
                    placeholder="输入命令或自然语言，例如：查询 CNXXXXXXA 专利详情"
                />
                <select id="cli-ocr-engine" class="cli-shell__engine">
                    <option value="paddle_ocr_vl">Paddle OCR</option>
                    <option value="glm_ocr">GLM OCR</option>
                </select>
                <button id="cli-send-btn" class="cli-shell__send">发送</button>
                <button id="cli-stop-btn" class="cli-shell__stop" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12" rx="2"/>
                    </svg>
                    <span>停止</span>
                </button>
            </div>
        </div>
    </div>

    <div id="cli-page-picker" class="cli-page-picker hidden">
        <div class="cli-page-picker__dialog">
            <div class="cli-page-picker__title">选择 PDF 解析页数</div>
            <div class="cli-page-picker__desc" id="cli-page-picker-desc">默认解析整份 PDF。</div>
            <label class="cli-field">
                <span>解析范围</span>
                <select id="cli-page-picker-mode">
                    <option value="all">全部页</option>
                    <option value="custom">自定义页码</option>
                </select>
            </label>
            <label class="cli-field cli-field--wide" id="cli-page-picker-input-wrap">
                <span>页码范围</span>
                <input id="cli-page-picker-input" class="cli-page-picker__input" type="text" placeholder="如: 1,3,5-8" />
            </label>
            <div class="cli-page-picker__hint">支持单页 `5`、范围 `5-8`、组合 `1,3,5-8`。</div>
            <div class="cli-page-picker__actions">
                <button id="cli-page-picker-cancel" type="button" class="cli-page-picker__btn cli-page-picker__btn--ghost">取消</button>
                <button id="cli-page-picker-apply" type="button" class="cli-page-picker__btn">应用</button>
            </div>
        </div>
    </div>
</div>

<button id="cli-launcher" class="cli-launcher" type="button">
    <svg class="cli-launcher__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 像素风格机器人头部-->
        <rect x="6" y="4" width="12" height="2" fill="currentColor"/>
        <rect x="4" y="6" width="16" height="2" fill="currentColor"/>
        <rect x="4" y="8" width="4" height="4" fill="currentColor"/>
        <rect x="10" y="8" width="4" height="4" fill="currentColor"/>
        <rect x="16" y="8" width="4" height="4" fill="currentColor"/>
        <rect x="4" y="12" width="16" height="2" fill="currentColor"/>
        <rect x="8" y="14" width="8" height="2" fill="currentColor"/>
        <rect x="10" y="16" width="4" height="2" fill="currentColor"/>
        <rect x="2" y="8" width="2" height="2" fill="currentColor"/>
        <rect x="20" y="8" width="2" height="2" fill="currentColor"/>
        <!-- 眼睛 -->
        <rect x="6" y="10" width="2" height="2" fill="#101521"/>
        <rect x="16" y="10" width="2" height="2" fill="#101521"/>
    </svg>
    <span class="cli-launcher__text">ALFRED CLI</span>
</button>

.cli-shell {
    position: fixed;
    right: 96px;
    bottom: 20px;
    width: min(860px, calc(100vw - 24px));
    height: min(78vh, 800px);
    display: flex;
    flex-direction: column;
    background: var(--cli-shell-bg);
    border: 1px solid var(--cli-shell-border);
    border-radius: 20px;
    box-shadow: var(--cli-shell-shadow);
    z-index: 10000;
    overflow: hidden;
    color: var(--cli-shell-text);
    font-family: Consolas, "SFMono-Regular", Menlo, monospace;
}

.cli-shell.hidden {
    display: none;
}

.cli-shell.minimized {
    height: 68px;
}

.cli-shell.fullscreen {
    top: 18px;
    right: 18px;
    bottom: 18px;
    left: 18px;
    width: auto;
    height: auto;
    border-radius: 22px;
}

.cli-shell.minimized .cli-shell__toolbar,
.cli-shell.minimized .cli-shell__body {
    display: none;
}

.cli-shell__header,
.cli-shell__toolbar,
.cli-shell__inputbar {
    padding: 12px 16px;
}

.cli-shell__header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--cli-shell-line);
    background: var(--cli-shell-header-bg);
}

.cli-shell__title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
}

.cli-shell__subtitle {
    margin-top: 4px;
    color: var(--cli-shell-muted);
    font-size: 12px;
}

.cli-shell__actions {
    display: flex;
    gap: 6px;
}

.cli-shell__icon-btn {
    width: auto !important;
    height: auto !important;
    border: none !important;
    border-radius: 0 !important;
    cursor: pointer !important;
    color: #374151 !important;
    background: transparent !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    padding: 4px !important;
    box-shadow: none !important;
    outline: none !important;
}

.cli-shell__icon-btn:hover {
    color: var(--cli-control-hover) !important;
    transform: scale(1.1) !important;
    background: transparent !important;
}

.cli-shell__icon-btn:active {
    transform: scale(0.95) !important;
    background: transparent !important;
}

.cli-shell__icon-btn--minimize:hover {
    color: #ffc107 !important;
    background: transparent !important;
}

.cli-shell__icon-btn--expand:hover {
    color: #2196f3 !important;
    background: transparent !important;
}

.cli-shell__icon-btn--close:hover {
    color: #ef5350 !important;
    background: transparent !important;
}

.cli-shell__toolbar {
    display: grid;
    grid-template-columns: 160px minmax(0, 1fr) auto auto;
    gap: 12px;
    align-items: end;
    border-bottom: 1px solid var(--cli-shell-line);
}

.cli-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.cli-field span {
    color: var(--cli-shell-soft);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.cli-field select {
    height: 38px;
    border: 1px solid var(--cli-select-border);
    border-radius: 10px;
    background: var(--cli-select-bg);
    color: var(--cli-shell-text);
    padding: 0 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.cli-field select:hover {
    border-color: var(--cli-select-hover-border);
}

.cli-field select:focus {
    outline: none;
    border-color: rgba(234, 112, 72, 0.8);
    box-shadow: 0 0 0 3px rgba(234, 112, 72, 0.3);
}

.cli-field select option {
    background: var(--cli-select-option-bg);
    color: var(--cli-shell-text);
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 500;
}

.cli-field select option:hover,
.cli-field select option:checked {
    background: rgba(234, 112, 72, 0.3);
    color: #ffffff;
}

.cli-badge {
    display: inline-flex;

.cli-badge:hover {

.cli-workflow__subtitle {

.cli-node__action {

.cli-node__action svg {

.cli-node__action svg path {

.cli-node__action:hover {
    color: var(--cli-shell-text) !important;
    transform: scale(1.15) !important;
    background: transparent !important;

.cli-node__action:active {

.cli-node__action--rename:hover {
    color: #3b82f6 !important;

.cli-node__action--pin:hover {
    color: #f97316 !important;
}

.cli-node__action--pin.cli-node__action--important {
    color: #f97316 !important;
}

.cli-node__action--delete:hover {
    color: #ef4444 !important;
}

.cli-shell__output {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    min-height: 0;
}

.cli-shell__suggestions {
    display: none;
    padding: 0 16px 10px;
    gap: 8px;
