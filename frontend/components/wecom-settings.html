<!-- 企业微信绑定设置组件 -->
<div class="wecom-settings-container" id="wecom-settings-container">
    <div class="wecom-settings-header">
        <div class="wecom-settings-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
        </div>
        <div class="wecom-settings-title">
            <h3>企业微信通知</h3>
            <p class="wecom-settings-desc">绑定企业微信后，任务完成将自动推送到您的企业微信</p>
        </div>
    </div>

    <div class="wecom-settings-content" id="wecom-settings-content">
        <!-- 加载状态 -->
        <div class="wecom-loading" id="wecom-loading">
            <div class="wecom-spinner"></div>
            <span>加载中...</span>
        </div>

        <!-- 服务未配置 -->
        <div class="wecom-not-configured" id="wecom-not-configured" style="display: none;">
            <div class="wecom-warning-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            </div>
            <p>企业微信服务未开启</p>
            <span class="wecom-hint">请联系管理员配置企业微信服务</span>
        </div>

        <!-- 未绑定状态 -->
        <div class="wecom-unbound" id="wecom-unbound" style="display: none;">
            <div class="wecom-bind-methods">
                <div class="wecom-bind-method">
                    <div class="method-header">
                        <span class="method-icon">📱</span>
                        <span class="method-title">方式一：扫码绑定</span>
                        <span class="method-badge recommended">推荐</span>
                    </div>
                    <p class="method-desc">使用企业微信App扫描二维码即可绑定</p>
                    <button class="wecom-btn wecom-btn-primary" id="wecom-show-qrcode-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                        </svg>
                        显示绑定二维码
                    </button>
                </div>

                <div class="wecom-bind-divider">
                    <span>或者</span>
                </div>

                <div class="wecom-bind-method">
                    <div class="method-header">
                        <span class="method-icon">✏️</span>
                        <span class="method-title">方式二：手动输入</span>
                    </div>
                    <p class="method-desc">输入您在企业微信通讯录中的账号</p>
                    <div class="manual-bind-form">
                        <input type="text" id="wecom-userid-input" placeholder="请输入企业微信账号" class="wecom-input">
                        <button class="wecom-btn wecom-btn-secondary" id="wecom-manual-bind-btn">
                            绑定
                        </button>
                    </div>
                    <span class="wecom-hint">账号可在企业微信通讯录中查看</span>
                </div>
            </div>
        </div>

        <!-- 已绑定状态 -->
        <div class="wecom-bound" id="wecom-bound" style="display: none;">
            <div class="wecom-bound-info">
                <div class="bound-status">
                    <span class="status-icon">✅</span>
                    <span class="status-text">已绑定企业微信</span>
                </div>
                <div class="bound-details">
                    <div class="bound-detail-item">
                        <span class="detail-label">企业微信账号：</span>
                        <span class="detail-value" id="wecom-bound-userid">-</span>
                    </div>
                    <div class="bound-detail-item">
                        <span class="detail-label">绑定时间：</span>
                        <span class="detail-value" id="wecom-bound-time">-</span>
                    </div>
                </div>
            </div>

            <div class="wecom-notification-toggle">
                <div class="toggle-label">
                    <span class="toggle-icon">🔔</span>
                    <span>接收推送通知</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="wecom-notification-toggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="wecom-bound-actions">
                <button class="wecom-btn wecom-btn-outline" id="wecom-test-btn">

                        <path d="M22 2L11 13"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z"/>

                    发送测试消息

                <button class="wecom-btn wecom-btn-danger" id="wecom-unbind-btn">

                        <path d="M18 6L6 18"/>
                        <path d="M6 6L18 18"/>
                    </svg>
                    解除绑定
                </button>
            </div>
        </div>
    </div>

    <!-- 二维码弹窗 -->
    <div class="wecom-modal" id="wecom-qrcode-modal" style="display: none;">
        <div class="wecom-modal-overlay"></div>
        <div class="wecom-modal-content">
            <div class="modal-header">

            </div>
        </div>
    </div>
</div>

<script>
class WecomSettings {
    constructor() {
        this.container = document.getElementById('wecom-settings-container');
        if (!this.container) return;
        
        this.bindStatus = null;
        this.countdownTimer = null;
        
        this.init();
    }
    
    async init() {
        await this.loadStatus();
        this.bindEvents();
    }
    
    async loadStatus() {
        try {
            const response = await fetch('/api/wecom/bind/status');
            const result = await response.json();
            
            if (result.success) {
                this.bindStatus = result.data;
                this.render();
            }
        } catch (error) {
            console.error('加载企业微信状态失败:', error);
            this.showNotConfigured();
        }
    }
    
    render() {
        document.getElementById('wecom-loading').style.display = 'none';
        
        if (!this.bindStatus.service_available) {
            this.showNotConfigured();
            return;
        }
        
        if (this.bindStatus.bound) {
            this.showBound();
        } else {
            this.showUnbound();
        }
    }
    
    showNotConfigured() {
        document.getElementById('wecom-loading').style.display = 'none';
        document.getElementById('wecom-not-configured').style.display = 'block';
    }
    
    showUnbound() {
        document.getElementById('wecom-unbound').style.display = 'block';
    }
    
    showBound() {
        document.getElementById('wecom-bound').style.display = 'block';
        document.getElementById('wecom-bound-userid').textContent = this.bindStatus.wecom_userid;
        document.getElementById('wecom-bound-time').textContent = this.bindStatus.bound_at || '-';
        document.getElementById('wecom-notification-toggle').checked = this.bindStatus.enabled;
    }
    
    bindEvents() {
        document.getElementById('wecom-show-qrcode-btn')?.addEventListener('click', () => {
            this.showQrcodeModal();
        });
        
        document.getElementById('wecom-manual-bind-btn')?.addEventListener('click', () => {
            this.manualBind();
        });
        
        document.getElementById('wecom-notification-toggle')?.addEventListener('change', (e) => {
            this.updateSettings(e.target.checked);
        });
        
        document.getElementById('wecom-test-btn')?.addEventListener('click', () => {
            this.sendTestMessage();
        });
        
        document.getElementById('wecom-unbind-btn')?.addEventListener('click', () => {
            this.unbind();
        });
        
        document.getElementById('wecom-modal-close')?.addEventListener('click', () => {
            this.closeQrcodeModal();
        });
        
        document.querySelector('.wecom-modal-overlay')?.addEventListener('click', () => {
            this.closeQrcodeModal();
        });
    }
    
    async showQrcodeModal() {
        const modal = document.getElementById('wecom-qrcode-modal');
        const container = document.getElementById('wecom-qrcode-container');
        
        modal.style.display = 'flex';
        container.innerHTML = `
            <div class="qrcode-placeholder">
                <div class="wecom-spinner"></div>
                <span>正在生成二维码...</span>
            </div>
        `;
        
        try {
            const response = await fetch('/api/wecom/bind/qrcode');
            const result = await response.json();
            
            if (result.success) {
                const qrcodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(result.data.qrcode_url)}`;
                container.innerHTML = `<img src="${qrcodeUrl}" alt="绑定二维码">`;
                
                this.startCountdown(result.data.expires_in);
            } else {
                container.innerHTML = `
                    <div class="qrcode-placeholder">
                        <span style="color: #ff4d4f;">${result.error || '生成二维码失败'}</span>
                    </div>
                `;
            }
        } catch (error) {
            container.innerHTML = `
                <div class="qrcode-placeholder">
                    <span style="color: #ff4d4f;">网络错误，请重试</span>
                </div>
            `;
        }
    }
    
    closeQrcodeModal() {
        const modal = document.getElementById('wecom-qrcode-modal');
        modal.style.display = 'none';
        
        if (this.countdownTimer) {
            clearInterval(this.countdownTimer);
            this.countdownTimer = null;
        }
    }
    
    startCountdown(seconds) {
        let remaining = seconds;
        const display = document.getElementById('wecom-countdown-time');
        
        const update = () => {
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            display.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            
            if (remaining <= 0) {
                clearInterval(this.countdownTimer);
                this.closeQrcodeModal();
                alert('二维码已过期，请重新获取');
            }
            remaining--;
        };
        
        update();
        this.countdownTimer = setInterval(update, 1000);
    }
    
    async manualBind() {
        const input = document.getElementById('wecom-userid-input');
        const wecomUserid = input.value.trim();
        
        if (!wecomUserid) {
            alert('请输入企业微信账号');
            return;
        }
        
        const btn = document.getElementById('wecom-manual-bind-btn');
        btn.disabled = true;
        btn.textContent = '绑定中...';
        
        try {
            const response = await fetch('/api/wecom/bind/manual', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ wecom_userid: wecomUserid })
            });
            
            const result = await response.json();
            
            if (result.success) {
                alert('绑定成功！');
                location.reload();
            } else {
                alert(result.error || '绑定失败');
            }
        } catch (error) {
            alert('网络错误，请重试');
        } finally {
            btn.disabled = false;
            btn.textContent = '绑定';
        }
    }
    
    async updateSettings(enabled) {
        try {
            const response = await fetch('/api/wecom/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled })
            });
            
            const result = await response.json();
            
            if (!result.success) {
                alert(result.error || '设置失败');
                document.getElementById('wecom-notification-toggle').checked = !enabled;
            }
        } catch (error) {
            alert('网络错误');
            document.getElementById('wecom-notification-toggle').checked = !enabled;
        }
    }
    
    async sendTestMessage() {
        const btn = document.getElementById('wecom-test-btn');
        btn.disabled = true;
        btn.textContent = '发送中...';
        
        try {
            const response = await fetch('/api/wecom/test', {
                method: 'POST'
            });
            
            const result = await response.json();
            
            if (result.success) {
                alert('测试消息已发送，请查看企业微信');
            } else {
                alert(result.error || '发送失败');
            }
        } catch (error) {
            alert('网络错误');
        } finally {
            btn.disabled = false;
            btn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
                </svg>
                发送测试消息
            `;
        }
    }
    
    async unbind() {
        if (!confirm('确定要解除企业微信绑定吗？解除后将不再收到推送通知。')) {
            return;
        }
        
        const btn = document.getElementById('wecom-unbind-btn');
        btn.disabled = true;
        btn.textContent = '解绑中...';
        
        try {
            const response = await fetch('/api/wecom/unbind', {
                method: 'POST'
            });
            
            const result = await response.json();
            
            if (result.success) {
                alert('解绑成功');
                location.reload();
            } else {
                alert(result.error || '解绑失败');
            }
        } catch (error) {
            alert('网络错误');
        } finally {
            btn.disabled = false;
            btn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18"/>
                    <path d="M6 6L18 18"/>
                </svg>
                解除绑定
            `;
        }
    }
}

document.addEventListener('DOMContentLoaded', () => {
    new WecomSettings();
});
</script>
