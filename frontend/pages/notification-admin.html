<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知公告管理 - ALFRED X IP</title>
    <link rel="stylesheet" href="../css/notification.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #F3F4F6;
            min-height: 100vh;
        }

        .admin-page-header {
            background: white;
            padding: 20px 24px;
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-page-title {
            font-size: 20px;
            font-weight: 600;
            color: #1F2937;
        }

        .admin-back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 14px;
            color: #6B7280;
            background: transparent;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .admin-back-btn:hover {
            background: #F3F4F6;
            color: #1F2937;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            background: #1F2937;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10000;
            animation: slideUp 0.3s ease-out;
        }

        .toast.success {
            background: #22C55E;
        }

        .toast.error {
            background: #EF4444;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #6B7280;
        }

        .empty-state-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            color: #D1D5DB;
        }

        .empty-state-text {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="admin-page-header">
        <h1 class="admin-page-title">通知公告管理</h1>
        <a href="/" class="admin-back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            返回主页
        </a>
    </div>

    <div class="notification-admin-container">
        <div class="notification-admin-tabs">
            <button class="admin-tab-btn active" data-tab="login-notification">登录通知</button>
            <button class="admin-tab-btn" data-tab="global-announcement">全局公告</button>
        </div>

        <!-- 登录通知管理 -->
        <div id="login-notification-tab" class="tab-content">
            <div class="notification-admin-card">
                <div class="notification-card-header">
                    <h3 class="notification-card-title">编辑登录通知</h3>
                    <div class="notification-card-actions">
                        <button class="notification-btn notification-btn-secondary" id="preview-login-btn">预览</button>
                        <button class="notification-btn notification-btn-primary" id="save-login-btn">保存</button>
                    </div>
                </div>
                <div class="notification-card-body">
                    <form id="login-notification-form">
                        <div class="notification-form-group">
                            <label class="notification-form-label">通知标题</label>
                            <input type="text" class="notification-form-input" id="login-title" placeholder="请输入通知标题">
                        </div>
                        <div class="notification-form-group">
                            <label class="notification-form-label">版本号</label>
                            <input type="text" class="notification-form-input" id="login-version" placeholder="例如: 1.0.0">
                        </div>
                        <div class="notification-form-group">
                            <label class="notification-form-label">通知类型</label>
                            <select class="notification-form-input notification-form-select" id="login-type">
                                <option value="welcome">欢迎通知</option>
                                <option value="update">更新通知</option>
                                <option value="important">重要通知</option>
                            </select>
                        </div>
                        <div class="notification-form-group">
                            <label class="notification-form-label">优先级</label>
                            <select class="notification-form-input notification-form-select" id="login-priority">
                                <option value="high">高</option>
                                <option value="medium">中</option>
                                <option value="low">低</option>
                            </select>
                        </div>
                        <div class="notification-form-group">
                            <label class="notification-form-label">通知内容</label>
                            <div id="login-content-sections"></div>
                            <button type="button" class="notification-content-add-btn" id="add-section-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"/>
                                    <line x1="5" y1="12" x2="19" y2="12"/>
                                </svg>
                                添加内容区块
                            </button>
                        </div>
                        <div class="notification-form-group">
                            <div class="notification-toggle">
                                <div class="notification-toggle-switch active" id="login-active-toggle"></div>
                                <span>启用通知</span>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="notification-admin-card">
                <div class="notification-card-header">
                    <h3 class="notification-card-title">历史通知</h3>
                </div>
                <div class="notification-card-body">
                    <table class="notification-list-table">
                        <thead>
                            <tr>
                                <th>标题</th>
                                <th>版本</th>
                                <th>类型</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="login-history-list">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 全局公告管理 -->
        <div id="global-announcement-tab" class="tab-content" style="display: none;">
            <div class="notification-admin-card">
                <div class="notification-card-header">
                    <h3 class="notification-card-title">发布新公告</h3>
                    <div class="notification-card-actions">
                        <button class="notification-btn notification-btn-primary" id="create-announcement-btn">发布公告</button>
                    </div>
                </div>
                <div class="notification-card-body">
                    <form id="announcement-form">
                        <div class="notification-form-group">
                            <label class="notification-form-label">公告标题 *</label>
                            <input type="text" class="notification-form-input" id="announcement-title" placeholder="请输入公告标题" required>
                        </div>
                        <div class="notification-form-group">
                            <label class="notification-form-label">公告内容 *</label>
                            <textarea class="notification-form-input notification-form-textarea" id="announcement-message" placeholder="请输入公告内容" required></textarea>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div class="notification-form-group">
                                <label class="notification-form-label">公告类型</label>
                                <select class="notification-form-input notification-form-select" id="announcement-type">
                                    <option value="maintenance">维护通知</option>
                                    <option value="info">信息通知</option>
                                    <option value="warning">警告通知</option>
                                    <option value="success">成功通知</option>
                                </select>
                            </div>
                            <div class="notification-form-group">
                                <label class="notification-form-label">优先级</label>
                                <select class="notification-form-input notification-form-select" id="announcement-priority">
                                    <option value="high">高 - 强制展示</option>
                                    <option value="medium">中</option>
                                    <option value="low">低</option>
                                </select>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div class="notification-form-group">
                                <label class="notification-form-label">开始时间</label>
                                <input type="text" class="notification-form-input" id="announcement-start-time" placeholder="例如: 2024-01-01 02:00">
                            </div>
                            <div class="notification-form-group">
                                <label class="notification-form-label">结束时间</label>
                                <input type="text" class="notification-form-input" id="announcement-end-time" placeholder="例如: 2024-01-01 04:00">
                            </div>
                        </div>
                        <div class="notification-form-group">
                            <label class="notification-form-label">预计时长</label>
                            <input type="text" class="notification-form-input" id="announcement-duration" placeholder="例如: 约2小时">
                        </div>
                        <div class="notification-form-group">
                            <label class="notification-form-label">影响范围</label>
                            <input type="text" class="notification-form-input" id="announcement-impact" placeholder="请描述影响范围">
                        </div>
                        <div class="notification-form-group">
                            <div class="notification-toggle">
                                <div class="notification-toggle-switch active" id="announcement-active-toggle"></div>
                                <span>立即启用</span>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="notification-admin-card">
                <div class="notification-card-header">
                    <h3 class="notification-card-title">公告列表</h3>
                </div>
                <div class="notification-card-body">
                    <table class="notification-list-table">
                        <thead>
                            <tr>
                                <th>标题</th>
                                <th>类型</th>
                                <th>优先级</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="announcement-list">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiBase = '/api';
        let loginNotificationData = null;
        let announcementsData = [];

        document.addEventListener('DOMContentLoaded', () => {
            initTabs();
            initToggles();
            loadLoginNotification();
            loadAnnouncements();
            initEventListeners();
        });

        function initTabs() {
            const tabBtns = document.querySelectorAll('.admin-tab-btn');
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const tabId = btn.dataset.tab;
                    document.querySelectorAll('.tab-content').forEach(content => {
                        content.style.display = 'none';
                    });
                    document.getElementById(`${tabId}-tab`).style.display = 'block';
                });
            });
        }

        function initToggles() {
            document.querySelectorAll('.notification-toggle-switch').forEach(toggle => {
                toggle.addEventListener('click', () => {
                    toggle.classList.toggle('active');
                });
            });
        }

        function initEventListeners() {
            document.getElementById('add-section-btn').addEventListener('click', addContentSection);
            document.getElementById('save-login-btn').addEventListener('click', saveLoginNotification);
            document.getElementById('preview-login-btn').addEventListener('click', previewLoginNotification);
            document.getElementById('create-announcement-btn').addEventListener('click', createAnnouncement);
        }

        async function loadLoginNotification() {
            try {
                const response = await fetch(`${apiBase}/admin/notifications`);
                const result = await response.json();

                if (result.success) {
                    const notifications = result.data.login_notifications || [];
                    if (notifications.length > 0) {
                        loginNotificationData = notifications[0];
                        populateLoginForm(loginNotificationData);
                    }
                    renderLoginHistory(notifications);
                }
            } catch (error) {
                console.error('加载登录通知失败:', error);
            }
        }

        function populateLoginForm(notification) {
            document.getElementById('login-title').value = notification.title || '';
            document.getElementById('login-version').value = notification.version || '';
            document.getElementById('login-type').value = notification.type || 'welcome';
            document.getElementById('login-priority').value = notification.priority || 'high';

            const activeToggle = document.getElementById('login-active-toggle');
            if (notification.is_active) {
                activeToggle.classList.add('active');
            } else {
                activeToggle.classList.remove('active');
            }

            const sectionsContainer = document.getElementById('login-content-sections');
            sectionsContainer.innerHTML = '';

            if (notification.content && Array.isArray(notification.content)) {
                notification.content.forEach(section => {
                    addContentSection(section.section, section.items);
                });
            }
        }

        function addContentSection(sectionTitle = '', items = ['']) {
            const sectionsContainer = document.getElementById('login-content-sections');
            const sectionId = Date.now();

            const sectionHtml = `
                <div class="notification-section-editor" id="section-${sectionId}" style="margin-bottom: 16px; padding: 16px; background: #F9FAFB; border-radius: 8px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <input type="text" class="notification-form-input" value="${sectionTitle}" placeholder="区块标题（如：新增功能）" style="width: 300px;" data-field="section-title">
                        <button type="button" class="notification-btn notification-btn-danger remove-section-btn" data-section="${sectionId}">删除区块</button>
                    </div>
                    <div class="section-items">
                        ${items.map(item => `
                            <div class="notification-content-item">
                                <input type="text" class="notification-content-item-input" value="${item}" placeholder="输入内容项">
                                <button type="button" class="notification-content-item-remove remove-item-btn">×</button>
                            </div>
                        `).join('')}
                    </div>
                    <button type="button" class="notification-content-add-btn add-item-btn" data-section="${sectionId}" style="margin-top: 8px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        添加内容项
                    </button>
                </div>
            `;

            sectionsContainer.insertAdjacentHTML('beforeend', sectionHtml);

            const newSection = document.getElementById(`section-${sectionId}`);
            newSection.querySelector('.remove-section-btn').addEventListener('click', () => {
                newSection.remove();
            });

            newSection.querySelector('.add-item-btn').addEventListener('click', () => {
                addSectionItem(newSection);
            });

            newSection.querySelectorAll('.remove-item-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.target.closest('.notification-content-item').remove();
                });
            });
        }

        function addSectionItem(sectionElement) {
            const itemsContainer = sectionElement.querySelector('.section-items');
            const itemHtml = `
                <div class="notification-content-item">
                    <input type="text" class="notification-content-item-input" placeholder="输入内容项">
                    <button type="button" class="notification-content-item-remove remove-item-btn">×</button>
                </div>
            `;
            itemsContainer.insertAdjacentHTML('beforeend', itemHtml);

            const newItem = itemsContainer.lastElementChild;
            newItem.querySelector('.remove-item-btn').addEventListener('click', () => {
                newItem.remove();
            });
        }

        function collectLoginNotificationData() {
            const sections = document.querySelectorAll('.notification-section-editor');
            const content = [];

            sections.forEach(section => {
                const title = section.querySelector('[data-field="section-title"]').value.trim();
                const items = Array.from(section.querySelectorAll('.notification-content-item-input'))
                    .map(input => input.value.trim())
                    .filter(v => v);

                if (title && items.length > 0) {
                    content.push({ section: title, items });
                }
            });

            return {
                id: loginNotificationData?.id,
                title: document.getElementById('login-title').value.trim(),
                version: document.getElementById('login-version').value.trim(),
                type: document.getElementById('login-type').value,
                priority: document.getElementById('login-priority').value,
                content,
                is_active: document.getElementById('login-active-toggle').classList.contains('active')
            };
        }

        async function saveLoginNotification() {
            const data = collectLoginNotificationData();

            if (!data.title) {
                showToast('请输入通知标题', 'error');
                return;
            }

            if (data.content.length === 0) {
                showToast('请至少添加一个内容区块', 'error');
                return;
            }

            try {
                const response = await fetch(`${apiBase}/admin/notifications/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    showToast('登录通知保存成功', 'success');
                    loadLoginNotification();
                } else {
                    showToast(result.error || '保存失败', 'error');
                }
            } catch (error) {
                showToast('保存失败，请重试', 'error');
            }
        }

        function previewLoginNotification() {
            const data = collectLoginNotificationData();

            const modal = document.createElement('div');
            modal.className = 'login-notification-modal';
            modal.innerHTML = `
                <div class="login-notification-content">
                    <div class="notification-header ${data.type}">
                        <div class="notification-header-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                            </svg>
                        </div>
                        <h2 class="notification-header-title">${data.title || '通知标题'}</h2>
                        <div class="notification-header-version">版本 ${data.version || '1.0.0'}</div>
                    </div>
                    <div class="notification-body">
                        ${data.content.map(section => `
                            <div class="notification-section">
                                <h3 class="notification-section-title">${section.section}</h3>
                                <ul class="notification-list">
                                    ${section.items.map(item => `
                                        <li class="notification-list-item">
                                            <span class="notification-list-icon new">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                    <polyline points="20 6 9 17 4 12"/>
                                                </svg>
                                            </span>
                                            <span>${item}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        `).join('') || '<p>暂无内容</p>'}
                    </div>
                    <div class="notification-footer">
                        <button class="notification-confirm-btn" onclick="this.closest('.login-notification-modal').remove()">关闭预览</button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.remove();
            });
        }

        function renderLoginHistory(notifications) {
            const tbody = document.getElementById('login-history-list');

            if (notifications.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                                </svg>
                                <p class="empty-state-text">暂无历史通知</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = notifications.map(n => `
                <tr>
                    <td>${n.title}</td>
                    <td>${n.version}</td>
                    <td>${n.type}</td>
                    <td>
                        <span class="notification-status-badge ${n.is_active ? 'active' : 'inactive'}">
                            ${n.is_active ? '已启用' : '已停用'}
                        </span>
                    </td>
                    <td>${n.created_at}</td>
                    <td>
                        <button class="notification-btn notification-btn-secondary" onclick="editLoginNotification('${n.id}')">编辑</button>
                        <button class="notification-btn notification-btn-danger" onclick="deleteLoginNotification('${n.id}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadAnnouncements() {
            try {
                const response = await fetch(`${apiBase}/admin/notifications`);
                const result = await response.json();

                if (result.success) {
                    announcementsData = result.data.global_announcements || [];
                    renderAnnouncements(announcementsData);
                }
            } catch (error) {
                console.error('加载公告失败:', error);
            }
        }

        function renderAnnouncements(announcements) {
            const tbody = document.getElementById('announcement-list');

            if (announcements.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                                </svg>
                                <p class="empty-state-text">暂无公告</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = announcements.map(a => `
                <tr>
                    <td>${a.title}</td>
                    <td>${a.type}</td>
                    <td>
                        <span class="notification-priority-badge ${a.priority}">${a.priority}</span>
                    </td>
                    <td>
                        <span class="notification-status-badge ${a.is_active ? 'active' : 'inactive'}">
                            ${a.is_active ? '已启用' : '已停用'}
                        </span>
                    </td>
                    <td>${a.created_at}</td>
                    <td>
                        <button class="notification-btn notification-btn-secondary" onclick="toggleAnnouncement('${a.id}', ${!a.is_active})">
                            ${a.is_active ? '停用' : '启用'}
                        </button>
                        <button class="notification-btn notification-btn-danger" onclick="deleteAnnouncement('${a.id}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        async function createAnnouncement() {
            const title = document.getElementById('announcement-title').value.trim();
            const message = document.getElementById('announcement-message').value.trim();

            if (!title || !message) {
                showToast('请填写公告标题和内容', 'error');
                return;
            }

            const data = {
                title,
                message,
                type: document.getElementById('announcement-type').value,
                priority: document.getElementById('announcement-priority').value,
                start_time: document.getElementById('announcement-start-time').value.trim(),
                end_time: document.getElementById('announcement-end-time').value.trim(),
                duration: document.getElementById('announcement-duration').value.trim(),
                impact: document.getElementById('announcement-impact').value.trim(),
                is_active: document.getElementById('announcement-active-toggle').classList.contains('active')
            };

            try {
                const response = await fetch(`${apiBase}/admin/announcements`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    showToast('公告发布成功', 'success');
                    document.getElementById('announcement-form').reset();
                    document.getElementById('announcement-active-toggle').classList.add('active');
                    loadAnnouncements();
                } else {
                    showToast(result.error || '发布失败', 'error');
                }
            } catch (error) {
                showToast('发布失败，请重试', 'error');
            }
        }

        async function toggleAnnouncement(id, isActive) {
            try {
                const response = await fetch(`${apiBase}/admin/announcements/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_active: isActive })
                });

                const result = await response.json();
                if (result.success) {
                    showToast(isActive ? '公告已启用' : '公告已停用', 'success');
                    loadAnnouncements();
                }
            } catch (error) {
                showToast('操作失败', 'error');
            }
        }

        async function deleteAnnouncement(id) {
            if (!confirm('确定要删除此公告吗？')) return;

            try {
                const response = await fetch(`${apiBase}/admin/announcements/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    showToast('公告已删除', 'success');
                    loadAnnouncements();
                }
            } catch (error) {
                showToast('删除失败', 'error');
            }
        }

        async function deleteLoginNotification(id) {
            if (!confirm('确定要删除此通知吗？')) return;

            try {
                const response = await fetch(`${apiBase}/admin/notifications/login/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    showToast('通知已删除', 'success');
                    loadLoginNotification();
                }
            } catch (error) {
                showToast('删除失败', 'error');
            }
        }

        function editLoginNotification(id) {
            const notification = loginNotificationData?.id === id ? loginNotificationData : null;
            if (notification) {
                populateLoginForm(notification);
                document.querySelector('[data-tab="login-notification"]').click();
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
